<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>派单工作台 · 管理员</title>
<style>
  :root{ --bg:#ededed; --ink:#111; --sub:#7a7a7a; --line:#dcdcdc; --green:#95ec69; --blue:#576b95; --red:#fa5151; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .topbar{background:#2e2e2e;color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;flex-shrink:0}
  .topbar h1{font-size:15px;font-weight:600}
  .topbar .grow{flex:1}
  .tbtn{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer}
  .tbtn:hover{background:rgba(255,255,255,.22)}
  .main{flex:1;display:flex;min-height:0;max-width:1180px;width:100%;margin:0 auto;background:#fff}
  /* 左侧会话列表 */
  .side{width:280px;border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
  .side-head{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:6px}
  .side-head button{flex:1;font-size:12px;padding:7px 4px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
  .side-head button:hover{background:#f5f5f5}
  .chat-list{flex:1;overflow-y:auto}
  .chat-item{display:flex;gap:10px;padding:12px;cursor:pointer;align-items:center;border-bottom:1px solid #f0f0f0}
  .chat-item:hover,.chat-item.on{background:#f0f0f0}
  .avatar{width:42px;height:42px;border-radius:8px;background:#9ca3af;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;position:relative}
  .online-dot{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;border:2px solid #fff}
  .od-on{background:#4ade80} .od-off{background:#c8c8c8}
  .ci-body{flex:1;min-width:0}
  .ci-name{font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:6px}
  .ci-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .unread{background:#fa5151;color:#fff;font-size:10px;border-radius:99px;padding:1px 6px;flex-shrink:0}
  .ci-sub{font-size:12px;color:var(--sub);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tags{font-size:10px;font-weight:600;padding:1px 6px;border-radius:99px;flex-shrink:0}
  .tg-shift{background:#f0fdf4;color:#16a34a} .tg-off{background:#f1f5f9;color:var(--sub)}
  .side-foot{padding:10px 12px;border-top:1px solid var(--line);text-align:center}
  /* 右侧聊天窗口 */
  .chatwin{flex:1;display:flex;flex-direction:column;min-width:0}
  .chat-head{padding:12px 18px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;background:#f7f7f7;display:flex;align-items:center;gap:8px}
  .chat-head .sub{font-size:11px;color:var(--sub);font-weight:400}
  .chat-box{flex:1;overflow-y:auto;padding:18px;background:var(--bg)}
  .msg{display:flex;gap:8px;margin-bottom:14px;align-items:flex-start}
  .msg.me{flex-direction:row-reverse}
  .avatar.sm{width:36px;height:36px;font-size:13px}
  .msg.me .avatar{background:#07c160}
  .bubble{max-width:60%;padding:9px 12px;border-radius:8px;background:#fff;font-size:14px;line-height:1.5;word-break:break-all;box-shadow:0 1px 1px rgba(0,0,0,.05)}
  .msg.me .bubble{background:var(--green)}
  .bubble .fn{font-size:11px;color:var(--sub);margin-bottom:3px}
  .bubble a{color:var(--blue);text-decoration:none;font-size:13px}
  .tcard{border-left:4px solid #07c160;background:#fff;border-radius:8px;padding:10px 12px;max-width:75%;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .msg.me .tcard{border-left-color:var(--amber)}
  .tcard .t{font-weight:700;font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .tcard .meta{font-size:12px;color:var(--sub);margin-top:5px;line-height:1.8}
  .st{font-size:10px;padding:2px 7px;border-radius:99px;font-weight:600;background:#f1f5f9;color:var(--sub)}
  .st-待接单{background:#fff7e6;color:#d97706} .st-已接单{background:#eff6ff;color:#3b82f6}
  .st-已交付{background:#f5f3ff;color:#8b5cf6} .st-已完成{background:#f0fdf4;color:#16a34a} .st-已拒绝{background:#fef2f2;color:#fa5151}
  .input-bar{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:#f7f7f7;align-items:flex-end}
  .input-bar textarea{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit;resize:none;height:40px;max-height:110px;background:#fff}
  .ibtn{background:#fff;border:1px solid var(--line);border-radius:8px;height:40px;font-size:13px;flex-shrink:0;padding:0 12px;cursor:pointer}
  .ibtn:hover{background:#f0f0f0}
  .send{background:#07c160;color:#fff;border:none;border-radius:8px;padding:0 20px;height:40px;font-size:14px;flex-shrink:0;cursor:pointer}
  .no-chat{flex:1;display:flex;align-items:center;justify-content:center;color:var(--sub)}
  /* 派单总览 */
  .overview{flex:1;overflow:auto;padding:16px;display:none}
  .overview.on{display:block}
  table.ov{width:100%;border-collapse:collapse;font-size:12px;background:#fff}
  table.ov th,table.ov td{border:1px solid var(--line);padding:7px 9px;text-align:left;white-space:nowrap}
  table.ov th{background:#f7f7f7}
  .ov-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
  .tot{font-size:13px}
  .tot b{color:#fa5151}
  /* 弹窗 */
  .mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:center;justify-content:center;padding:16px}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:460px;max-height:86vh;overflow:auto}
  .modal h2{font-size:16px;margin-bottom:14px}
  .modal label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
  .modal input,.modal select,.modal textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
  .modal textarea{min-height:80px;resize:vertical}
  .modal .btns{display:flex;gap:10px;margin-top:18px}
  .modal .btns button{flex:1;padding:10px;font-size:14px;border-radius:8px;cursor:pointer;border:none}
  .btn-p{background:#07c160;color:#fff} .btn-p:disabled{opacity:.5}
  .btn-o{background:#f0f0f0;color:var(--ink)}
  .code-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .empty{padding:30px;text-align:center;color:var(--sub);font-size:13px}
  .toast{display:none;position:fixed;top:18px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:9px 18px;border-radius:99px;font-size:13px;z-index:99}
  @media (max-width:760px){ .side{width:200px} .bubble{max-width:76%} }
</style>
</head>
<body>
<div class="topbar">
  <h1>📦 派单工作台</h1><span class="grow"></span>
  <button class="tbtn" onclick="location.href='/index.html'">← 返回看板</button>
  <button class="tbtn" id="btnInvites">邀请码</button>
  <button class="tbtn" id="btnLogout">退出</button>
</div>
<div class="main">
  <div class="side">
    <div class="side-head">
      <button id="viewChatBtn" style="background:#07c160;color:#fff;border-color:#07c160">💬 聊天</button>
      <button id="viewOvBtn">📊 派单总览</button>
    </div>
    <div class="chat-list" id="chatList"><div class="empty">加载中…</div></div>
    <div class="side-foot"><span style="font-size:11px;color:var(--sub)">🟢=在线 · 🟢在班=已打卡</span></div>
  </div>
  <div class="chatwin" id="chatWin">
    <div class="chat-head" id="chatHead">选择左侧写手开始派单</div>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-bar">
      <input type="file" id="fileInput" style="display:none">
      <button class="ibtn" id="btnCard">📨 派单卡</button>
      <button class="ibtn" id="btnFile" title="发文件">📎</button>
      <textarea id="msgInput" placeholder="输入消息，Enter发送…"></textarea>
      <button class="send" id="btnSend">发送</button>
    </div>
  </div>
  <div class="overview" id="ovWin">
    <div class="ov-head">
      <b>派单总览 · 利润联动</b>
      <span class="tot" id="ovTotals"></span>
    </div>
    <table class="ov" id="ovTable"></table>
  </div>
</div>

<!-- 派单卡弹窗 -->
<div class="mask" id="cardMask">
  <div class="modal">
    <h2>📨 发派单卡 → <span id="cTo" style="color:#07c160"></span></h2>
    <label>派单标题 *</label><input id="cTitle" placeholder="如：某品牌公众号推文 2000字">
    <label>报酬（元）* —— 派出去的价，由你自定义</label><input id="cReward" type="number" min="0" step="0.01">
    <label>截止日期</label><input id="cDeadline" type="date">
    <label>交付要求</label><textarea id="cReq" placeholder="字数/风格/交稿格式等"></textarea>
    <label>关联台账订单 *（必选——自动算利润、写手交付后自动同步原单；订单号会同步给写手）</label>
    <select id="cOrder"><option value="">—— 请从台账选择订单 ——</option></select>
    <label>需求附件（可选，≤25MB）</label>
    <input type="file" id="cFile" style="font-size:12px">
    <div style="font-size:12px;color:var(--sub);margin-top:4px" id="cFileInfo"></div>
    <div class="btns">
      <button class="btn-o" onclick="closeCard()">取消</button>
      <button class="btn-p" id="btnCardSend">发送派单卡</button>
    </div>
  </div>
</div>
<!-- 邀请码弹窗 -->
<div class="mask" id="invMask">
  <div class="modal">
    <h2>🎟️ 邀请码</h2>
    <button class="btn-p" id="btnGenInvite" style="width:100%;padding:10px">＋ 生成新邀请码</button>
    <div id="invList" style="margin-top:12px"></div>
    <div class="btns"><button class="btn-o" onclick="$('invMask').classList.remove('show')">关闭</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const TOKEN = localStorage.getItem('jdy_token');
const ME = JSON.parse(localStorage.getItem('jdy_user') || 'null');
if (!TOKEN || !ME || ME.role !== 'admin') location.href = '/login.html';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const fmt = n => Number(n).toLocaleString('zh-CN', { maximumFractionDigits: 2 });
const r2 = n => Math.round(n * 100) / 100;
const dl = id => `/api/files/${id}/download?token=${TOKEN}`;
let currentPeer = null, chats = [], cardFile = null;

function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2400); }
function authFetch(url, opt = {}) {
  return fetch(url, { ...opt, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN, ...(opt.headers || {}) } })
    .then(async r => { const j = await r.json(); if (r.status === 401) { localStorage.removeItem('jdy_token'); localStorage.removeItem('jdy_user'); location.href = '/login.html'; throw new Error('登录过期'); } return j; });
}
function ping(title, body) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(.25, ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .35);
    o.start(); o.stop(ctx.currentTime + .35); setTimeout(() => ctx.close(), 500);
  } catch (e) {}
  if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
    try { new Notification(title, { body }); } catch (e) {}
  }
  toast(title + (body ? '：' + String(body).slice(0, 24) : ''));
}
if ('Notification' in window && Notification.permission === 'default') {
  document.addEventListener('click', function ask() { Notification.requestPermission(); document.removeEventListener('click', ask); }, { once: true });
}

/* ================= 会话列表 ================= */
async function loadTeam() {
  const j = await authFetch('/api/chats');
  chats = j.chats || [];
  $('chatList').innerHTML = chats.length ? chats.map(c => {
    const u = c.user;
    const last = c.last ? (c.last.type === 'text' ? c.last.text : c.last.type === 'file' ? '[文件]' + c.last.fileName : '[派单卡]') : '（未聊过）';
    return `<div class="chat-item ${currentPeer === u.id ? 'on' : ''}" onclick="openChat('${u.id}')">
      <div class="avatar">${esc((u.displayName || '?').slice(0, 1))}<span class="online-dot ${u.sockOnline ? 'od-on' : 'od-off'}"></span></div>
      <div class="ci-body">
        <div class="ci-name"><span class="nm">${esc(u.displayName)}</span>${c.unread ? `<span class="unread">${c.unread}</span>` : ''}</div>
        <div class="ci-sub">${esc(last)}</div>
        <div class="ci-sub">${u.shift ? '<span class="tags tg-shift">在班</span>' : '<span class="tags tg-off">未上班</span>'}</div>
      </div></div>`;
  }).join('') : '<div class="empty">还没有写手。<br>点上方「邀请码」生成一个，发给写手注册</div>';
}

/* ================= 聊天 ================= */
function renderMsg(m) {
  const me = m.from === ME.id;
  const ava = esc((m.fromName || '?').slice(0, 1));
  let inner;
  if (m.type === 'text') inner = `<div class="bubble">${me ? '' : `<div class="fn">${esc(m.fromName)}</div>`}${esc(m.text)}</div>`;
  else if (m.type === 'file') inner = `<div class="bubble">📎 <a href="${dl(m.fileId)}" download>${esc(m.fileName)}</a><div style="font-size:11px;color:var(--sub)">${fmt(Math.round((m.fileSize||0)/1024))} KB</div></div>`;
  else if (m.type === 'card') inner = `<div class="tcard"><div class="fn" style="font-size:11px;color:var(--sub)">派单卡</div><div id="cm-${m.cardId}"></div></div>`;
  return `<div class="msg ${me ? 'me' : ''}"><div class="avatar sm">${ava}</div>${inner}</div>`;
}
async function openChat(peer) {
  currentPeer = peer;
  showView('chat');
  const c = chats.find(x => x.user.id === peer);
  $('chatHead').innerHTML = `👤 ${esc(c ? c.user.displayName : '')}
    <span class="sub">${c ? (c.user.sockOnline ? '🟢在线' : '离线') + ' · ' + (c.user.shift ? '在班' : '未上班') : ''}</span>`;
  loadTeam();
  const j = await authFetch('/api/messages?peer=' + peer);
  $('chatBox').innerHTML = (j.messages || []).map(renderMsg).join('') || '<div class="empty">开始对话，或直接甩一张派单卡</div>';
  await fillCardMsgs();
  $('chatBox').scrollTop = $('chatBox').scrollHeight;
}
async function fillCardMsgs() {
  const slots = document.querySelectorAll('[id^="cm-"]');
  if (!slots.length) return;
  const j = await authFetch('/api/dispatch/overview');
  const map = {}; (j.rows || []).forEach(c => map[c._id] = c);
  slots.forEach(el => {
    const c = map[el.id.slice(3)];
    if (!c) return;
    el.innerHTML = `<div class="t"><span>${esc(c.title)}</span><span class="st st-${c.status}">${c.status}</span></div>
      <div class="meta">订单 <span style="font-family:monospace;color:var(--blue)">${esc(c.orderNo || '-')}</span> · 写手：${esc(c.toName)} · 报酬 <b style="color:#fa5151">${fmt(c.reward)}</b> 元 · 截止 ${c.deadline || '不限'}
      ${c.status === '已交付' ? `<button class="ibtn" style="height:26px;margin-top:4px" onclick="finishCard('${c._id}')">确认完成</button>` : ''}</div>`;
  });
}
async function finishCard(id) {
  const j = await authFetch(`/api/cards/${id}/finish`, { method: 'POST' });
  if (j.ok) { toast('已确认完成'); fillCardMsgs(); loadOverview(); }
  else alert(j.error);
}
$('btnSend').onclick = async () => {
  const text = $('msgInput').value.trim();
  if (!text || !currentPeer) return;
  $('msgInput').value = '';
  const j = await authFetch('/api/messages', { method: 'POST', body: JSON.stringify({ peer: currentPeer, text }) });
  if (!j.ok) toast(j.error);
};
$('msgInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('btnSend').click(); } });
$('btnFile').onclick = () => { if (!currentPeer) return toast('先选写手'); $('fileInput').click(); };
$('fileInput').onchange = async () => {
  const f = $('fileInput').files[0]; if (!f || !currentPeer) return;
  if (f.size > 25 * 1024 * 1024) { toast('文件超过25MB'); return; }
  toast('上传中…');
  const fd = new FormData(); fd.append('file', f); fd.append('peer', currentPeer);
  try {
    const up = await fetch('/api/files', { method: 'POST', headers: { Authorization: 'Bearer ' + TOKEN }, body: fd }).then(r => r.json());
    if (!up.ok) throw new Error(up.error);
    await authFetch('/api/messages/file', { method: 'POST', body: JSON.stringify({ peer: currentPeer, ...up }) });
  } catch (e) { toast('上传失败：' + e.message); }
  $('fileInput').value = '';
};

/* ================= 派单卡 ================= */
$('btnCard').onclick = async () => {
  if (!currentPeer) return toast('先在左侧选一个写手');
  const c = chats.find(x => x.user.id === currentPeer);
  $('cTo').textContent = c ? c.user.displayName : '';
  $('cTitle').value = ''; $('cReward').value = ''; $('cDeadline').value = ''; $('cReq').value = '';
  cardFile = null; $('cFile').value = ''; $('cFileInfo').textContent = '';
  $('cOrder').innerHTML = '<option value="">—— 请从台账选择订单 ——</option>';
  const j = await authFetch('/api/orders');
  (j.orders || []).slice(0, 100).forEach(o => {
    $('cOrder').insertAdjacentHTML('beforeend', `<option value="${o._id}">${esc(o.orderNo)}（${o.date} · ${fmt(o.amount)}元 · 分成${fmt(r2(o.amount * o.shareRate / 100))}）</option>`);
  });
  $('cardMask').classList.add('show');
};
function closeCard() { $('cardMask').classList.remove('show'); }
$('cFile').onchange = () => {
  const f = $('cFile').files[0];
  cardFile = f;
  $('cFileInfo').textContent = f ? `已选：${f.name}（${fmt(Math.round(f.size / 1024))} KB${f.size > 25 * 1024 * 1024 ? '，超25MB！' : ''}）` : '';
};
$('btnCardSend').onclick = async () => {
  const title = $('cTitle').value.trim(), reward = Number($('cReward').value);
  if (!title) { toast('请填标题'); return; }
  if (!isFinite(reward) || reward < 0) { toast('请填报酬金额'); return; }
  if (!$('cOrder').value) { toast('必须从台账选择一个订单才能发派单卡'); return; }
  $('btnCardSend').disabled = true; $('btnCardSend').textContent = '发送中…';
  try {
    let fileId = null, fileName = null;
    if (cardFile) {
      if (cardFile.size > 25 * 1024 * 1024) throw new Error('附件超25MB');
      const fd = new FormData(); fd.append('file', cardFile); fd.append('peer', currentPeer);
      const up = await fetch('/api/files', { method: 'POST', headers: { Authorization: 'Bearer ' + TOKEN }, body: fd }).then(r => r.json());
      if (!up.ok) throw new Error(up.error);
      fileId = up.fileId; fileName = up.fileName;
    }
    const j = await authFetch('/api/cards', { method: 'POST', body: JSON.stringify({
      to: currentPeer, title, reward, requirement: $('cReq').value,
      deadline: $('cDeadline').value, orderId: $('cOrder').value, fileId, fileName,
    }) });
    if (!j.ok) throw new Error(j.error);
    toast('派单卡已发送');
    closeCard();
    if (currentPeer) openChat(currentPeer);
  } catch (e) { toast('发送失败：' + e.message); }
  $('btnCardSend').disabled = false; $('btnCardSend').textContent = '发送派单卡';
};

/* ================= 派单总览 ================= */
function showView(v) {
  $('chatWin').style.display = v === 'chat' ? '' : 'none';
  $('ovWin').classList.toggle('on', v === 'ov');
  $('viewChatBtn').style.cssText = v === 'chat' ? 'background:#07c160;color:#fff;border-color:#07c160' : '';
  $('viewOvBtn').style.cssText = v === 'ov' ? 'background:#07c160;color:#fff;border-color:#07c160' : '';
}
$('viewChatBtn').onclick = () => showView('chat');
$('viewOvBtn').onclick = () => { showView('ov'); loadOverview(); };
async function loadOverview() {
  const j = await authFetch('/api/dispatch/overview');
  $('ovTotals').innerHTML = `已关联 ${j.totals.linked} 单 · 报酬合计 <b>${fmt(j.totals.totReward)}</b> · 原单分成 <b>${fmt(j.totals.totShare)}</b> · 利润合计 <b>${fmt(j.totals.totProfit)}</b> 元`;
  $('ovTable').innerHTML = '<tr><th>派单</th><th>订单号</th><th>原单分成</th><th>派单报酬</th><th style="color:#fa5151">利润</th><th>写手</th><th>状态</th><th>截止</th></tr>' +
    (j.rows.length ? j.rows.map(r => `<tr>
      <td>${esc(r.title)}</td><td style="font-family:monospace">${esc(r.orderNo || '—')}</td>
      <td>${r.orderShare != null ? fmt(r.orderShare) : '—'}</td><td>${fmt(r.reward)}</td>
      <td style="color:${r.profit != null ? (r.profit >= 0 ? '#16a34a' : '#fa5151') : '#999'};font-weight:700">${r.profit != null ? fmt(r.profit) : '—'}</td>
      <td>${esc(r.toName)}</td><td><span class="st st-${r.status}">${r.status}</span></td><td>${r.deadline || '—'}</td></tr>`).join('')
    : '<tr><td colspan="8" class="empty">还没有派单</td></tr>');
}

/* ================= 邀请码 ================= */
$('btnInvites').onclick = async () => { $('invMask').classList.add('show'); loadInvites(); };
$('btnGenInvite').onclick = async () => {
  const j = await authFetch('/api/invites', { method: 'POST', body: JSON.stringify({ count: 1 }) });
  if (j.ok) { toast('已生成，点击码可复制'); loadInvites(); }
};
async function loadInvites() {
  const j = await authFetch('/api/invites');
  if (!j.ok) return;
  $('invList').innerHTML = j.invites.length ? j.invites.map(i => `
    <div class="code-item">
      <code style="cursor:pointer" onclick="navigator.clipboard.writeText('${i.code}').then(()=>toast('已复制：${i.code}'))" title="点击复制">${i.code}</code>
      <span style="font-size:11px;color:var(--sub)">${i.usedBy ? '已使用' : '未使用'}</span>
    </div>`).join('') : '<div class="empty">还没有邀请码，点上面按钮生成</div>';
}
$('btnLogout').onclick = () => { localStorage.removeItem('jdy_token'); localStorage.removeItem('jdy_user'); location.href = '/login.html'; };

/* ================= 实时推送 ================= */
const socket = io({ auth: { token: TOKEN } });
socket.on('msg', m => {
  if (currentPeer && (m.from === currentPeer || m.to === currentPeer)) { $('chatBox').insertAdjacentHTML('beforeend', renderMsg(m)); fillCardMsgs(); $('chatBox').scrollTop = $('chatBox').scrollHeight; }
  loadTeam();
  ping('新消息', (m.fromName || '') + '：' + (m.type === 'text' ? m.text : m.type === 'file' ? '[文件]' + m.fileName : '[派单卡]'));
});
socket.on('card', c => { fillCardMsgs(); loadOverview(); ping('派单卡更新', c.title + ' → ' + c.status); });
socket.on('presence', () => loadTeam());

loadTeam();
loadOverview();
</script>
</body>
</html>
