<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>派单聊天 · 管理后台</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#faf7f1">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="stylesheet" href="/admin/app.css">
<style>
  /* 【v21.0】本页已改为薄壳：整页逻辑与后台「派单聊天」面板共用 /admin/mod-chat.js
     （样式走 Shadow DOM + /admin/chat.css）。这里只负责独立打开时的外层留白与面包屑。 */
  body { padding: 18px 16px 40px; }
  .page { max-width: 1400px; margin: 0 auto; }
  .crumb { font-size: 12.5px; color: var(--ink2); margin-bottom: 10px; }
  .crumb a { color: var(--green2); }
  #chatRoot { height: calc(100vh - 110px); }
</style>
</head>
<body>
<div class="page">
  <div class="crumb"><a href="/admin.html">🏠 工作台</a> / 派单聊天</div>
  <div id="chatRoot"><div class="skeleton"><i></i><i></i><i></i><i></i></div></div>
</div>
<script type="module">
  import { guardAdmin } from '/admin/app.js';
  import { mount } from '/admin/mod-chat.js';
  if (guardAdmin()) mount(document.getElementById('chatRoot')).catch(e => {
    document.getElementById('chatRoot').innerHTML = '<div class="empty">加载失败：' + e.message + '</div>';
  });
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("/service-worker.js").catch(function () {}); });
}
</script>
</body>
</html>
