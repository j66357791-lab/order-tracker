<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>管理工作台 · 小沐文案</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#faf7f1">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="stylesheet" href="/admin/app.css">
<style>
/* 【自包含兜底】外壳骨架的关键样式内联一份：
   service-worker 换版本后的首次访问可能仍拿到上一版 app.css，
   内联后即使外链样式是旧的，导航与内嵌页高度也不会塌掉。 */
.shell { display: flex; min-height: 100vh; }
.nav { width: 238px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.nav-items { flex: 1; padding: 10px; }
.content { flex: 1; min-width: 0; padding: 26px 30px 60px; }
.embed-frame { width: 100%; height: calc(100vh - 86px); border: 0; display: block; background: #faf7f1; }
/* 【v20.8】iframe 骨架 + 面板加载占位（同样内联一份防旧 app.css） */
.embed-panel { position: relative; }
.sk-overlay { position: absolute; inset: 0; background: var(--paper); z-index: 2; padding: 2px; }
.skeleton { padding: 6px 0; }
.skeleton i { display: block; height: 14px; border-radius: 7px; background: #f3eee3; margin-bottom: 12px; animation: sk 1.2s ease-in-out infinite; }
.skeleton i:nth-child(1) { width: 34%; height: 20px; }
.skeleton i:nth-child(2) { width: 100%; height: 76px; }
.skeleton i:nth-child(3) { width: 92%; height: 76px; }
.skeleton i:nth-child(4) { width: 96%; height: 76px; }
@keyframes sk { 0%, 100% { opacity: 1 } 50% { opacity: .5 } }
/* 导航收起态的骨架样式也内联一份（同上：防旧 app.css） */
.nav-collapse { margin-left: auto; flex-shrink: 0; width: 28px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink2); font-size: 13px; line-height: 1; cursor: pointer; }
@media (min-width: 861px) {
  .nav { transition: width .2s ease; }
  .nav.mini { width: 68px; }
  .nav.mini .nav-brand { flex-direction: column; gap: 7px; padding: 12px 6px; }
  .nav.mini .nav-brand .name, .nav.mini .nav-brand .nav-role { display: none; }
  .nav.mini .nav-collapse { margin-left: 0; }
  .nav.mini .nav-items { padding: 10px 8px; }
  .nav.mini .nav-item { justify-content: center; padding: 12px 0; gap: 0; }
  .nav.mini .nav-item .lbl { display: none; }
  .nav.mini .nav-item .ico { width: auto; font-size: 19px; }
  .nav.mini .nav-foot .who { display: none; }
  .nav.mini #logoutBtn .ico-out { display: inline; }
  .nav.mini #logoutBtn .lbl { display: none; }
}
#logoutBtn .ico-out { display: none; }
@media (max-width: 860px) {
  .shell { flex-direction: column; }
  .nav { width: 100%; height: auto; position: sticky; top: 0; z-index: 50; flex-direction: row; align-items: center; overflow-x: auto; padding: 0 8px; }
  .nav-items { display: flex; padding: 6px; flex: 1; gap: 2px; }
  .content { padding: 18px 16px 60px; }
  .embed-frame { height: calc(100vh - 134px); }
  .nav-collapse { display: none; }
}
</style>
</head>
<body>
<div class="shell">
  <aside class="nav">
    <div class="nav-brand"><span class="seal">沐</span><span class="name serif">小沐文案</span><span class="nav-role">管理中心</span><button class="nav-collapse" id="navToggle" type="button" title="收起 / 展开左侧导航" aria-label="收起或展开左侧导航">‹</button></div>
    <div class="nav-items" id="navItems"></div>
    <div class="nav-foot">
      <div class="who" id="whoName">…</div>
      <button class="btn-ghost" style="width:100%" id="logoutBtn" title="退出登录"><span class="ico-out">⏻</span><span class="lbl">退出登录</span></button>
    </div>
  </aside>

  <main class="content">
    <!-- ① 工作台（面板） -->
    <div id="panel-home">
      <div class="content-head">
        <div>
          <h1 class="serif" id="helloName">管理员，欢迎回来</h1>
          <div class="sub">十项功能全部就位——点左侧导航即点即达，无需离开管理界面</div>
        </div>
        <div class="spacer"></div>
        <a class="btn-ghost" href="/portal.html">回首页</a>
      </div>

      <div class="card" style="padding:16px 20px;margin-bottom:18px">
        <div class="inline" style="flex-wrap:nowrap">
          <input id="gSearch" placeholder="🔍 全局搜索：手机号 / 工号 / 订单号 / 订单备注" style="flex:1">
        </div>
        <div id="gSearchResult" style="margin-top:10px"></div>
      </div>

      <div class="grid4 stats-grid" style="margin-bottom:20px">
        <a class="stat warn" href="#" onclick="return navGo('withdraw')"><b id="stWd">--</b><span>待审批提现</span></a>
        <a class="stat" href="#" onclick="return navGo('game')"><b id="stPlaying">--</b><span>进行中对局</span></a>
        <a class="stat" href="#" onclick="return navGo('game')"><b id="stPlayers">--</b><span>游戏玩家</span></a>
        <a class="stat" href="#" onclick="return navGo('security')"><b id="stUsers">--</b><span>平台账号</span></a>
      </div>

      <div class="notice">
        <b>十个入口已全部就位</b>，左侧导航可点顶部 ‹ 收起成图标条，鼠标划过看名字。<br>
        <b>原生面板</b>（无嵌套滚动、打开即用）：工作台 / 游戏控制器 / 用户端配置 / 安全与用户 /
        <b>广告管理</b> / <b>提现审批</b> / <b>派单总览</b> / <b>财务对账</b>；
        仅剩 2 项（台账 / 派单聊天）仍为原页面内嵌运行，正在继续迁移。<br>
        <span style="color:var(--green2)">切回已打开过的入口会自动取最新数据，不用再按 F5；角标也会自己更新。</span>
      </div>
    </div>

    <!-- ② 内嵌页面面板：全部迁完，已无 iframe。
         保留 .embed-panel/.sk-overlay 样式与 ensureFrame 逻辑，万一以后还要临时挂外部页可直接用。 -->

    <!-- ③ 模块面板容器（挂载后显示） -->
    <div id="panel-orders" style="display:none"></div>
    <div id="panel-dispatch" style="display:none"></div>
    <div id="panel-ads" style="display:none"></div>
    <div id="panel-withdraw" style="display:none"></div>
    <div id="panel-overview" style="display:none"></div>
    <div id="panel-recon" style="display:none"></div>
    <div id="panel-game" style="display:none"></div>
    <div id="panel-mall" style="display:none"></div>
    <div id="panel-security" style="display:none"></div>
  </main>
</div>

<script type="module">
import { TOKEN, ME, guardAdmin, api, renderNav, updateNav, esc } from '/admin/app.js';

// 【v20.8】面板模块按需加载：原来是 5 个 mod-* 静态 import，首屏就把本次根本不点的也一起下载了。
// 现在点哪个下哪个；导航悬停/聚焦时提前下载（用户从移动到点下通常有 300~800ms，够下完）。
const LAZY = {
  orders:   () => import('/admin/mod-orders.js'),
  dispatch: () => import('/admin/mod-chat.js'),
  overview: () => import('/admin/mod-cards.js').then(m => ({ mount: m.mountOverview })),
  recon:    () => import('/admin/mod-cards.js').then(m => ({ mount: m.mountRecon })),
  ads:      () => import('/admin/mod-ads.js'),
  withdraw: () => import('/admin/mod-withdraw.js'),
  game:     () => import('/admin/mod-game.js'),
  mall:     () => import('/admin/mod-mall.js'),
  security: () => import('/admin/mod-security.js'),
};
// 【v21.0】iframe 全部迁完，这里空了。保留结构是为了万一以后还要临时挂外部页。
const FRAMES = {};

if (guardAdmin()) {
  const name = ME.displayName || '管理员';
  document.getElementById('whoName').textContent = '👤 ' + name;
  document.getElementById('helloName').textContent = name + '，欢迎回来';

  const el = id => document.getElementById(id);
  const cap = k => k[0].toUpperCase() + k.slice(1);
  const hostEl = k => el('panel-' + k);
  const frameEl = k => el('frame' + cap(k));
  const skEl = k => el('sk' + cap(k));
  const isFrameKey = k => Object.prototype.hasOwnProperty.call(FRAMES, k);
  const ALL_KEYS = Object.keys(LAZY).concat(Object.keys(FRAMES));

  const badges = {};
  const mounted = {};     // key -> { mode:'panel'|'frame', refresh? }
  const prefetched = {};
  let current = 'home';

  const SKELETON = '<div class="skeleton"><i></i><i></i><i></i><i></i></div>';

  function hideSk(key) { const s = skEl(key); if (s) s.style.display = 'none'; }

  function show(key) {
    current = key;
    const home = el('panel-home');
    if (home) home.style.display = key === 'home' ? '' : 'none';
    ALL_KEYS.forEach(k => { const p = hostEl(k); if (p) p.style.display = k === key ? '' : 'none'; });
    updateNav(key, badges);   // 【v20.8】只切高亮与角标，不再重建整块导航 DOM
    // 【v20.8】去掉了原来每次切换都执行的 window.scrollTo({top:0})：内容在面板里滚动，外壳本来就没滚动过
    history.replaceState(null, '', key === 'home' ? '/admin.html' : '/admin.html#' + key);
  }

  // 【v20.8】切回已挂载的面板就重新取数 —— 这是"必须按 F5 才更新"的正解。
  // 每个 mount() 一直都有 return { refresh }，只是此前没有任何地方调用过它。
  function refreshKey(key) {
    const m = mounted[key];
    if (!m || key === 'home') return;
    if (m.mode === 'panel' && typeof m.refresh === 'function') {
      try { m.refresh(); } catch (e) {}
    }
  }

  function ensureFrame(key) {
    const f = frameEl(key);
    if (!f) return null;
    if (!f.dataset.wired) {
      f.dataset.wired = '1';
      f.addEventListener('load', () => { f.dataset.loaded = '1'; hideSk(key); });
    }
    if (!f.getAttribute('src')) f.src = FRAMES[key];
    return f;
  }

  async function navigate(key) {
    if (key !== 'home' && !LAZY[key] && !FRAMES[key]) return;

    if (key === 'home') { show('home'); return; }

    // 已挂载：切过去 + 取新数据
    if (mounted[key]) { show(key); refreshKey(key); return; }

    if (LAZY[key]) {
      const host = hostEl(key);
      if (!host) { show(key); return; }
      mounted[key] = { mode: 'panel', refresh: null };   // 先占位，连点不会重复 mount
      show(key);
      if (!host.innerHTML.trim()) host.innerHTML = SKELETON;   // 骨架先顶上，避免切过去一片空白
      try {
        const mod = await LAZY[key]();
        const r = await mod.mount(host);   // 支持 async mount（派单聊天要先加载 socket.io）
        if (r && typeof r.refresh === 'function') mounted[key].refresh = r.refresh;
      } catch (e) {
        host.innerHTML = '<div class="empty">模块加载失败（' + esc(String((e && e.message) || e)) + '）</div>';
      }
      return;
    }

    // iframe：先切过去（容器里已有骨架盖在上面），再给 src
    const f = ensureFrame(key);
    mounted[key] = { mode: 'frame' };
    show(key);
    if (f && f.dataset.loaded) hideSk(key);
  }

  window.navigate = (key) => { navigate(key); };
  window.navGo = (key) => { navigate(key); return false; };

  // —— 【v20.8】预取：悬停 / 聚焦 / 触摸按下时提前加载，点下去往往已经好了 ——
  function prefetch(key) {
    if (!key || key === 'home' || prefetched[key] || mounted[key]) return;
    prefetched[key] = true;
    if (LAZY[key]) { LAZY[key]().catch(() => { prefetched[key] = false; }); return; }
    if (isFrameKey(key)) ensureFrame(key);
  }
  const navHost = el('navItems');
  if (navHost) {
    const onHover = e => { const it = e.target.closest('.nav-item'); if (it && it.dataset.key) prefetch(it.dataset.key); };
    navHost.addEventListener('mouseover', onHover);
    navHost.addEventListener('focusin', onHover);
    navHost.addEventListener('touchstart', onHover, { passive: true });
  }
  // 空闲时预取最常用的一个（桌面 + 非省流量模式才做，避免手机白花流量）
  function idlePreload() {
    const c = navigator.connection || {};
    if (c.saveData || /(^|-)2g/.test(c.effectiveType || '')) return;
    if (window.innerWidth < 1024) return;
    prefetch('orders');
  }
  if ('requestIdleCallback' in window) requestIdleCallback(idlePreload, { timeout: 3000 });
  else setTimeout(idlePreload, 2000);

  // —— 全局搜索：手机号/工号精确查用户 + 订单号/备注模糊查订单 ——
  let _searchTimer = null;
  document.getElementById('gSearch').addEventListener('input', (e) => {
    clearTimeout(_searchTimer);
    const kw = e.target.value.trim();
    _searchTimer = setTimeout(() => runSearch(kw), 350);
  });
  async function runSearch(kw) {
    const box = document.getElementById('gSearchResult');
    if (kw.length < 2) { box.innerHTML = ''; return; }
    box.innerHTML = '<div style="font-size:12.5px;color:var(--ink2)">搜索中…</div>';
    const users = [], ordersHit = [];
    try {
      await Promise.all([
        api('/api/admin/find-user/' + encodeURIComponent(kw)).then(j => { if (j.ok && j.user) users.push(j.user); }).catch(() => {}),
        api('/api/admin/users').then(j => {
          if (j.ok) for (const u of j.users) {
            if ((u.username || '').includes(kw) || (u.displayName || '').includes(kw) || (u.uid || '') === kw) {
              if (!users.some(x => x._id === u._id)) users.push(u);
            }
          }
        }).catch(() => {}),
        api('/api/orders?q=' + encodeURIComponent(kw)).then(j => {
          if (j.ok) for (const o of (j.orders || [])) {
            if (ordersHit.length < 8) ordersHit.push(o);
          }
        }).catch(() => {}),
      ]);
    } catch (e) { /* 单个接口失败不影响其余结果 */ }
    const uHtml = users.length ? '<div style="font-size:12px;color:var(--ochre);font-weight:600;margin-bottom:6px">👤 用户</div>' + users.map(u =>
      '<div class="inline" style="padding:5px 0;border-bottom:1px dashed var(--line)">' +
      '<b>' + esc(u.name || u.displayName || u.username || '') + '</b>' +
      '<span style="color:var(--ink2);font-size:12.5px">' + esc(u.phone || u.username || '') + (u.uid ? ' · 工号 ' + esc(u.uid) : '') + '</span>' +
      '<span style="flex:1"></span>' +
      '<button class="btn-ghost" style="padding:2px 10px;font-size:11.5px" onclick="navGo(\'security\')">去管理</button></div>').join('') : '';
    const oHtml = ordersHit.length ? '<div style="font-size:12px;color:var(--green2);font-weight:600;margin:8px 0 6px">📒 订单</div>' + ordersHit.map(o =>
      '<div class="inline" style="padding:5px 0;border-bottom:1px dashed var(--line)">' +
      '<b class="num">' + esc(o.orderNo) + '</b>' +
      '<span style="color:var(--ink2);font-size:12.5px">¥' + esc(o.amount) + ' · ' + esc(o.status) + (o.note ? ' · ' + esc(o.note.slice(0, 16)) : '') + '</span>' +
      '<span style="flex:1"></span>' +
      '<button class="btn-ghost" style="padding:2px 10px;font-size:11.5px" onclick="navGo(\'orders\')">去台账</button></div>').join('') : '';
    box.innerHTML = (uHtml + oHtml) || '<div style="font-size:12.5px;color:var(--ink2)">没有匹配的用户或订单（手机号/工号精确匹配用户，订单号/备注模糊匹配订单）</div>';
  }

  // —— 摘要数据 + 导航角标 ——
  const H = { headers: { 'Authorization': 'Bearer ' + TOKEN } };
  const setStat = (id, v) => { const n = el(id); if (n && v != null) n.textContent = v; };
  const setBadge = (k, v) => { if (v > 0) badges[k] = v; else delete badges[k]; };
  let badgeBusy = false;
  async function loadBadges() {
    if (badgeBusy) return;
    badgeBusy = true;
    try {
      await Promise.all([
        fetch('/api/admin/withdrawals?status=', H).then(r => r.json())
          .then(j => { if (j.ok && j.stats) { setStat('stWd', j.stats.pending); setBadge('withdraw', j.stats.pending); } }).catch(() => {}),
        fetch('/api/admin/activity-stats', H).then(r => r.json())
          .then(j => { if (j.ok && j.game) { setStat('stPlaying', j.game.playingSessions); setBadge('game', j.game.playingSessions); } }).catch(() => {}),
        fetch('/api/shanhai/admin/stats', H).then(r => r.json())
          .then(j => { if (j.ok) setStat('stPlayers', j.players); }).catch(() => {}),
        fetch('/api/admin/leads', H).then(r => r.json())
          .then(j => { if (j.ok) setBadge('mall', (j.leads || []).filter(l => l.status !== '已跟进').length); }).catch(() => {}),
        fetch('/api/admin/users', H).then(r => r.json())
          .then(j => { if (j.ok && Array.isArray(j.users)) setStat('stUsers', j.users.length + '+'); }).catch(() => {}),
      ]);
    } finally { badgeBusy = false; }
    updateNav(current, badges);
  }

  // 【v20.8】角标自动更新：切回窗口立刻刷 + 每 60s 一次；页面隐藏时停表（不白花流量）
  const BADGE_MS = 60000;
  let badgeTimer = null;
  const startBadgeTimer = () => { if (!badgeTimer) badgeTimer = setInterval(() => { if (!document.hidden) loadBadges(); }, BADGE_MS); };
  const stopBadgeTimer = () => { if (badgeTimer) { clearInterval(badgeTimer); badgeTimer = null; } };
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { stopBadgeTimer(); return; }
    loadBadges();          // 从别的窗口/标签切回来：角标 + 当前面板都取新数据
    startBadgeTimer();
    refreshKey(current);
  });

  document.getElementById('logoutBtn').onclick = () => {
    localStorage.removeItem('jdy_token'); localStorage.removeItem('jdy_user');
    location.href = '/login.html';
  };

  // —— 【v20.6】左侧导航收起 / 展开：只留图标，鼠标划过用 title 看名字；状态记在本地 ——
  (function initNavCollapse() {
    const nav = document.querySelector('.nav');
    const btn = document.getElementById('navToggle');
    const KEY = 'jdy_nav_mini';
    if (!nav) return;
    function apply(mini) {
      nav.classList.toggle('mini', mini);
      if (btn) {
        btn.textContent = mini ? '›' : '‹';
        btn.title = mini ? '展开左侧导航' : '收起左侧导航';
        btn.setAttribute('aria-expanded', mini ? 'false' : 'true');
      }
    }
    apply(localStorage.getItem(KEY) === '1');
    if (btn) btn.onclick = () => {
      const mini = !nav.classList.contains('mini');
      apply(mini);
      try { localStorage.setItem(KEY, mini ? '1' : '0'); } catch (e) {}
    };
  })();

  // 初始面板：支持 #game / #mall / #security 等直达
  const init = (location.hash || '').replace('#', '');
  renderNav('home', badges);   // 先渲染一次导航，任何后续异步/异常都不再影响左侧入口
  navigate(ALL_KEYS.includes(init) ? init : 'home');
  window.addEventListener('hashchange', () => {
    const k = (location.hash || '').replace('#', '');
    if (k && k !== current) navigate(k);
  });
  loadBadges().then(startBadgeTimer);
}
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('/service-worker.js').catch(function () {}); }); }
</script>
</body>
</html>
