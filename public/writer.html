<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写手工作台 · 派单系统</title>
<style>
  :root{ --bg:#f1f5f9; --card:#fff; --ink:#0f172a; --sub:#64748b; --line:#e2e8f0;
    --blue:#3b82f6; --green:#16a34a; --amber:#d97706; --red:#dc2626; --purple:#8b5cf6; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  .wrap{max-width:860px;margin:0 auto;padding:16px 14px 60px}
  header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  header h1{font-size:18px}
  .badge{font-size:11px;padding:3px 8px;border-radius:99px;font-weight:600}
  .b-green{background:#f0fdf4;color:var(--green)} .b-grey{background:#f1f5f9;color:var(--sub)}
  .grow{flex:1}
  button{cursor:pointer;border:none;font-size:13px;border-radius:8px;padding:8px 14px}
  .btn-p{background:var(--blue);color:#fff} .btn-p:hover{background:#2563eb}
  .btn-g{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn-danger{background:none;color:var(--red);padding:6px 10px}
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tabs button{flex:1;padding:9px;background:#fff;border:1px solid var(--line);border-radius:9px;font-size:14px}
  .tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .panel h3{font-size:14px;margin-bottom:10px}
  .card-item{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  .card-item .t{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
  .card-item .meta{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.7}
  .reward{color:var(--green);font-weight:800;font-size:16px}
  .st{font-size:11px;padding:3px 9px;border-radius:99px;font-weight:600}
  .st-待接单{background:#fffbeb;color:var(--amber)} .st-已接单{background:#eff6ff;color:var(--blue)}
  .st-已交付{background:#f0fdf4;color:var(--green)} .st-已完成{background:#f1f5f9;color:var(--sub)}
  .st-已拒绝{background:#fef2f2;color:var(--red)}
  .req{margin-top:8px;font-size:13px;background:#f8fafc;border-radius:8px;padding:8px 10px;white-space:pre-wrap;word-break:break-word}
  .chat-box{height:52vh;overflow-y:auto;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
  .mrow{max-width:78%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.5;word-break:break-word}
  .mrow.me{align-self:flex-end;background:var(--blue);color:#fff}
  .mrow.them{align-self:flex-start;background:#fff;border:1px solid var(--line)}
  .mrow .fn{font-size:10px;opacity:.7;margin-bottom:2px}
  .mfile{color:inherit;text-decoration:underline;cursor:pointer;font-weight:600}
  .mcard{align-self:stretch;max-width:100%;background:#fff;border:1px solid var(--line);border-left:4px solid var(--purple);border-radius:10px;padding:10px 12px}
  .mcard .t{font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
  .mcard .meta{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.7}
  .composer{display:flex;gap:8px;margin-top:10px}
  .composer input[type=text]{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px}
  .empty{text-align:center;color:var(--sub);font-size:13px;padding:30px 0}
  .mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:440px;max-height:86vh;overflow:auto}
  .modal h2{font-size:16px;margin-bottom:12px}
  .modal label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
  .modal input,.modal textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  .modal textarea{min-height:90px;resize:vertical}
  .modal .btns{display:flex;gap:10px;margin-top:16px}
  .modal .btns button{flex:1;padding:9px}
  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:99px;font-size:13px;display:none;z-index:99}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>写手工作台</h1>
    <span id="meName" class="badge b-grey"></span>
    <span id="shiftBadge" class="badge b-grey">未上班</span>
    <span class="grow"></span>
    <button class="btn-p" id="btnShift">上班打卡</button>
    <button class="btn-g" id="btnLogout">退出</button>
  </header>

  <div class="tabs">
    <button id="tabCards" class="on">我的单子</button>
    <button id="tabChat">聊天（<span id="chatBadge">0</span>）</button>
  </div>

  <div id="cardsPanel">
    <div class="panel">
      <h3>派给我的单子</h3>
      <div id="cardList"><div class="empty">还没有派单，等管理员派单吧</div></div>
    </div>
  </div>

  <div id="chatPanel" style="display:none">
    <div class="panel">
      <h3 id="chatTitle">与管理员聊天</h3>
      <div class="chat-box" id="chatBox"></div>
      <div class="composer">
        <input type="text" id="msgInput" placeholder="输入消息…">
        <button class="btn-g" id="btnFile">📎 文件</button>
        <button class="btn-p" id="btnSend">发送</button>
      </div>
      <input type="file" id="fileInput" style="display:none">
      <div class="err" id="chatErr" style="color:var(--red);font-size:12px;margin-top:6px;min-height:14px"></div>
    </div>
  </div>
</div>

<!-- 派单卡详情/预览 -->
<div class="mask" id="mask">
  <div class="modal">
    <h2 id="pvTitle"></h2>
    <div class="st" id="pvStatus"></div>
    <label>报酬</label><div class="reward" id="pvReward" style="font-size:20px"></div>
    <label>截止日期</label><div id="pvDeadline"></div>
    <label>交付要求</label><div class="req" id="pvReq"></div>
    <div id="pvFileBox"></div>
    <div class="btns" id="pvBtns"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id);
const API = '/api';
const TOKEN = localStorage.getItem('jdy_token');
let ME = null, socket = null, cards = [], unread = 0;

const fmt = n => Number(n).toLocaleString('zh-CN', { maximumFractionDigits: 2 });
function authFetch(url, opt = {}) {
  return fetch(url, { ...opt, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN, ...(opt.headers || {}) } })
    .then(async r => { const j = await r.json(); if (!j.ok && r.status === 401) { location.href = '/login.html'; throw new Error('登录过期'); } return j; });
}
function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2200); }
function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

(async () => {
  if (!TOKEN) { location.href = '/login.html'; return; }
  const me = await authFetch('/api/me');
  if (!me.ok || me.user.role !== 'writer') { location.href = me.user && me.user.role === 'admin' ? '/index.html' : '/login.html'; return; }
  ME = me.user;
  $('meName').textContent = ME.displayName;
  renderShift(ME.shift);

  socket = io({ auth: { token: TOKEN } });
  socket.on('msg', m => {
    if (m.type === 'card') { loadCards(); }
    if (m.from !== ME.id) {
      unread++; $('chatBadge').textContent = unread;
      if (!$('chatPanel').style || $('chatPanel').style.display === 'none') toast('收到新消息');
      if (!$('chatPanel').closest || getComputedStyle($('chatPanel')).display !== 'none') addMsg(m);
    }
  });
  socket.on('card', c => { loadCards(); fillCardMsgs(); toast('派单卡更新：' + c.title + ' → ' + c.status); });
  socket.on('connect', () => {});

  loadCards();
})();

function renderShift(on) {
  $('shiftBadge').textContent = on ? '● 在班中' : '未上班';
  $('shiftBadge').className = 'badge ' + (on ? 'b-green' : 'b-grey');
  $('btnShift').textContent = on ? '下班打卡' : '上班打卡';
}
$('btnShift').onclick = async () => {
  const j = await authFetch('/api/shift', { method: 'POST', body: JSON.stringify({ shift: !ME.shift }) });
  if (j.ok) { ME.shift = j.shift; renderShift(j.shift); toast(j.shift ? '已上班，管理员可以给你派单了' : '已下班'); }
};

function renderCard(c) {
  const act = c.status === '待接单'
    ? `<button class="btn-p" onclick="preview('${c._id}')">查看详情 / 接单</button>`
    : c.status === '已接单'
      ? `<button class="btn-p" onclick="deliver('${c._id}')">提交交付</button>`
      : '';
  return `<div class="card-item">
    <div class="t"><span>${esc(c.title)}</span><span class="st st-${c.status}">${c.status}</span></div>
    <div class="meta">报酬 <span class="reward">${fmt(c.reward)}</span> 元 · 截止 ${c.deadline || '不限'}
      ${c.fileName ? ` · 附件：<a class="mfile" href="/api/files/${c.fileId}/download" download style="color:var(--blue)">${esc(c.fileName)}</a>` : ''}</div>
    ${c.requirement ? `<div class="req">${esc(c.requirement)}</div>` : ''}
    ${act ? `<div style="margin-top:8px">${act}</div>` : ''}
  </div>`;
}
async function loadCards() {
  const j = await authFetch('/api/mycards');
  if (!j.ok) return;
  cards = j.cards;
  $('cardList').innerHTML = cards.length ? cards.map(renderCard).join('') : '<div class="empty">还没有派单，等管理员派单吧</div>';
}
function preview(id) {
  const c = cards.find(x => x._id === id); if (!c) return;
  $('pvTitle').textContent = c.title;
  $('pvStatus').textContent = c.status; $('pvStatus').className = 'st st-' + c.status;
  $('pvReward').textContent = fmt(c.reward) + ' 元';
  $('pvDeadline').textContent = c.deadline || '不限';
  $('pvReq').textContent = c.requirement || '（无附加要求）';
  $('pvFileBox').innerHTML = c.fileId
    ? `<label>需求附件</label><a class="mfile" href="/api/files/${c.fileId}/download" download style="color:var(--blue);font-size:13px">📎 ${esc(c.fileName)}</a>`
    : '';
  $('pvBtns').innerHTML = `
    <button class="btn-g" onclick="closePv()">先不决定</button>
    <button class="btn-g" onclick="decide('${c._id}','decline')">拒 绝</button>
    <button class="btn-p" onclick="decide('${c._id}','accept')">接 单</button>`;
  $('mask').classList.add('show');
}
function closePv() { $('mask').classList.remove('show'); }
async function decide(id, act) {
  const j = await authFetch(`/api/cards/${id}/${act}`, { method: 'POST' });
  if (!j.ok) { alert(j.error); return; }
  closePv(); loadCards();
  toast(act === 'accept' ? '已接单，开工吧！' : '已拒绝，等下一个单子');
}
async function deliver(id) {
  if (!confirm('确认已完成并提交交付？提交后管理员那边会同步为「待结算」。')) return;
  const j = await authFetch(`/api/cards/${id}/deliver`, { method: 'POST' });
  if (!j.ok) { alert(j.error); return; }
  loadCards(); toast('已提交交付！');
}

/* ---- 聊天 ---- */
$('tabCards').onclick = () => {
  $('tabCards').classList.add('on'); $('tabChat').classList.remove('on');
  $('cardsPanel').style.display = ''; $('chatPanel').style.display = 'none';
};
$('tabChat').onclick = async () => {
  $('tabChat').classList.add('on'); $('tabCards').classList.remove('on');
  $('cardsPanel').style.display = 'none'; $('chatPanel').style.display = '';
  unread = 0; $('chatBadge').textContent = 0;
  const j = await authFetch('/api/chats');
  if (j.ok && j.chats.length) { loadChat(j.chats[0].user.id); }
  else loadChat(null);
};
async function loadChat(adminId) {
  if (!adminId) { $('chatBox').innerHTML = '<div class="empty">暂无会话</div>'; return; }
  $('chatBox').dataset.peer = adminId;
  const j = await authFetch('/api/messages?peer=' + adminId);
  $('chatBox').innerHTML = (j.messages || []).map(m => renderMsg(m)).join('') || '<div class="empty">打个招呼吧～</div>';
  await fillCardMsgs();
  $('chatBox').scrollTop = $('chatBox').scrollHeight;
}
// 聊天里的派单卡：拉取卡片数据填充摘要
async function fillCardMsgs() {
  const slots = document.querySelectorAll('[id^="cm-"]');
  if (!slots.length) return;
  const j = await authFetch('/api/mycards');
  const map = {}; (j.cards || []).forEach(c => map[c._id] = c);
  slots.forEach(el => {
    const c = map[el.id.slice(3)];
    if (!c) { el.innerHTML = '<span style="font-size:12px;color:var(--sub)">（卡片不存在）</span>'; return; }
    el.innerHTML = `<div class="t"><span>${esc(c.title)}</span><span class="st st-${c.status}">${c.status}</span></div>
      <div class="meta">报酬 <b class="reward" style="font-size:14px">${fmt(c.reward)}</b> 元 · 截止 ${c.deadline || '不限'}</div>
      ${c.status === '待接单' ? `<div style="margin-top:6px"><button class="btn-p" onclick="preview('${c._id}')">查看详情 / 接单</button></div>` : ''}`;
  });
}
function renderMsg(m) {
  if (m.type === 'card') {
    return `<div class="mcard" data-mid="${m._id}"><div class="fn">${esc(m.fromName)} · 派单卡</div><div id="cm-${m.cardId}"></div></div>`;
  }
  const mine = m.from === ME.id;
  const body = m.type === 'file'
    ? `📎 <a class="mfile" href="/api/files/${m.fileId}/download" download>${esc(m.fileName)}</a> <small>(${(m.fileSize/1024/1024).toFixed(1)}MB)</small>`
    : esc(m.text);
  return `<div class="mrow ${mine ? 'me' : 'them'}"><div class="fn">${esc(m.fromName)}</div>${body}</div>`;
}
function addMsg(m) {
  if (m.from !== ($('chatBox').dataset.peer || '') && m.to !== ($('chatBox').dataset.peer || '')) return;
  $('chatBox').insertAdjacentHTML('beforeend', renderMsg(m));
  $('chatBox').scrollTop = $('chatBox').scrollHeight;
}
async function sendMsg() {
  const peer = $('chatBox').dataset.peer; if (!peer) return;
  const text = $('msgInput').value.trim(); if (!text) return;
  $('msgInput').value = ''; $('chatErr').textContent = '';
  const j = await authFetch('/api/messages', { method: 'POST', body: JSON.stringify({ peer, text }) });
  if (!j.ok) $('chatErr').textContent = j.error;
}
$('btnSend').onclick = sendMsg;
$('msgInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });
$('btnFile').onclick = () => $('fileInput').click();
$('fileInput').onchange = async () => {
  const peer = $('chatBox').dataset.peer;
  const f = $('fileInput').files[0]; if (!f || !peer) return;
  if (f.size > 25 * 1024 * 1024) { $('chatErr').textContent = '文件超过25MB，请走微信传'; return; }
  $('chatErr').textContent = '上传中…';
  const fd = new FormData(); fd.append('file', f); fd.append('peer', peer);
  try {
    const up = await fetch('/api/files', { method: 'POST', headers: { Authorization: 'Bearer ' + TOKEN }, body: fd }).then(r => r.json());
    if (!up.ok) throw new Error(up.error);
    const j = await authFetch('/api/messages/file', { method: 'POST', body: JSON.stringify({ peer, ...up }) });
    if (!j.ok) throw new Error(j.error);
    $('chatErr').textContent = '';
  } catch (e) { $('chatErr').textContent = '上传失败：' + e.message; }
  $('fileInput').value = '';
};
$('btnLogout').onclick = () => { localStorage.removeItem('jdy_token'); localStorage.removeItem('jdy_user'); location.href = '/login.html'; };
</script>
</body>
</html>
