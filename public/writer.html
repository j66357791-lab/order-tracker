<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>写手工作台 · 派单系统</title>
<style>
  :root{
    --bg:#f2f3f5; --card:#fff; --ink:#111827; --sub:#6b7280; --line:#e5e7eb;
    --green:#07c160; --green-dk:#059a4e; --green-bg:#e8f9ef;
    --blue:#3b82f6; --blue-bg:#eff6ff;
    --amber:#d97706; --amber-bg:#fff7e6;
    --purple:#8b5cf6; --purple-bg:#f5f3ff;
    --cyan:#0891b2; --cyan-bg:#ecfeff;
    --red:#dc2626; --red-bg:#fef2f2;
    --grey:#64748b; --grey-bg:#f1f5f9;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}

  /* ===== 断线提示条 ===== */
  #connBar{display:none;background:linear-gradient(90deg,#fef3c7,#fde68a);color:#92400e;font-size:12px;text-align:center;padding:6px 12px;flex-shrink:0}
  #connBar.on{display:block}

  /* ===== 顶栏 ===== */
  .topbar{background:linear-gradient(135deg,#1f2937,#111827);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#07c160,#059a4e);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .topbar h1{font-size:15px;font-weight:600}
  .topbar .sub{font-size:11px;opacity:.65;margin-top:1px}
  .topbar .grow{flex:1}
  .me-badge{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border-radius:99px;padding:5px 12px;font-size:12px}
  .me-badge .shift-tag{font-size:11px;padding:1px 7px;border-radius:99px}
  .st-on{background:var(--green);color:#fff}
  .st-off{background:rgba(255,255,255,.25);color:rgba(255,255,255,.8)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .d-on{background:#4ade80;box-shadow:0 0 6px rgba(74,222,128,.8)}
  .d-off{background:#6b7280}

  /* ===== 主体 ===== */
  .main{flex:1;overflow:hidden;position:relative}
  .panel{display:none;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .panel.on{display:block}
  .wrap{max-width:760px;margin:0 auto;padding:14px 14px 90px}

  /* ===== Tab栏 ===== */
  .tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;cursor:pointer;color:var(--sub);font-size:11px;transition:color .15s;position:relative;user-select:none}
  .tab .ico{font-size:20px;line-height:1}
  .tab.on{color:var(--green);font-weight:600}
  .tab .reddot{position:absolute;top:6px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}

  /* ===== 通用组件 ===== */
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(17,24,39,.06)}
  .card h3{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .btn{border:none;border-radius:9px;padding:9px 16px;font-size:13px;cursor:pointer;font-weight:500;transition:filter .15s, transform .05s}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-g{background:var(--green);color:#fff}.btn-g:hover:not(:disabled){filter:brightness(1.06)}
  .btn-o{background:var(--green-bg);color:var(--green-dk)}
  .btn-bl{background:var(--blue-bg);color:var(--blue)}
  .btn-r{background:var(--red-bg);color:var(--red)}
  .btn-gh{background:var(--grey-bg);color:var(--sub)}
  .btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
  input,select,textarea{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none;background:#fff;color:var(--ink);transition:border .15s}
  input:focus,select,textarea:focus{border-color:var(--green)}
  .pill{font-size:11px;padding:2px 9px;border-radius:99px;font-weight:500;display:inline-block;white-space:nowrap}
  .st-待接单{background:var(--amber-bg);color:var(--amber)}
  .st-已接单{background:var(--blue-bg);color:var(--blue)}
  .st-待审核{background:var(--purple-bg);color:var(--purple)}
  .st-待打款{background:var(--cyan-bg);color:var(--cyan)}
  .st-已完成{background:var(--green-bg);color:var(--green-dk)}
  .st-已拒绝{background:var(--grey-bg);color:var(--grey)}
  .st-已驳回{background:var(--red-bg);color:var(--red)}
  .empty{text-align:center;color:var(--sub);font-size:13px;padding:36px 0}
  .flow-tip{font-size:11px;color:var(--sub);background:var(--grey-bg);border-radius:8px;padding:8px 10px;line-height:1.6;margin-bottom:12px}
  .flow-tip b{color:var(--green-dk)}

  /* ===== 统计 ===== */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .stat{background:var(--card);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:0 1px 3px rgba(17,24,39,.06)}
  .stat .v{font-size:20px;font-weight:700}
  .stat .l{font-size:11px;color:var(--sub);margin-top:2px}
  .stat.v-green .v{color:var(--green-dk)} .stat.v-cyan .v{color:var(--cyan)} .stat.v-blue .v{color:var(--blue)}

  /* ===== 派单卡列表 ===== */
  .order-card{background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(17,24,39,.06)}
  .order-card .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .order-card .hd .t{font-weight:600;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .order-card .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--sub);margin-bottom:8px}
  .order-card .meta b{color:var(--amber);font-size:14px}
  .order-card .note{font-size:12px;color:var(--sub);background:var(--bg);border-radius:8px;padding:7px 9px;margin-bottom:8px;line-height:1.5}
  .order-card .note.warn{background:var(--red-bg);color:var(--red)}
  .order-card .ops{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

  /* ===== 聊天 ===== */
  #chatLayout{display:flex;height:100%}
  #convList{width:230px;border-right:1px solid var(--line);background:#fff;overflow-y:auto;flex-shrink:0}
  .conv{display:flex;gap:10px;padding:12px 14px;cursor:pointer;align-items:center;border-bottom:1px solid #f3f4f6;transition:background .15s}
  .conv:hover{background:#f9fafb}
  .conv.on{background:var(--green-bg)}
  .avatar{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#6ee7b7,#10b981);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;position:relative}
  .avatar .dot{position:absolute;right:-2px;bottom:-2px;border:2px solid #fff}
  .conv .info{flex:1;min-width:0}
  .conv .nm{font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
  .conv .nm .sh{font-size:10px;color:var(--green-dk);background:var(--green-bg);padding:1px 6px;border-radius:99px}
  .conv .last{font-size:11px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
  .conv .unread{min-width:17px;height:17px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;flex-shrink:0}
  #chatRight{flex:1;display:flex;flex-direction:column;min-width:0}
  #chatHead{padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;flex-shrink:0}
  #chatHead .sub{font-size:11px;color:var(--sub);font-weight:400}
  #chatBox{flex:1;overflow-y:auto;padding:14px;background:var(--bg)}
  .msg{display:flex;margin-bottom:12px;gap:8px}
  .msg.mine{flex-direction:row-reverse}
  .msg .bub{max-width:72%;background:#fff;border-radius:4px 12px 12px 12px;padding:9px 12px;font-size:13px;line-height:1.55;box-shadow:0 1px 2px rgba(17,24,39,.05);word-break:break-word}
  .msg.mine .bub{background:var(--green);color:#fff;border-radius:12px 4px 12px 12px}
  .msg .bub a{color:var(--blue);text-decoration:none;font-size:12px}
  .msg.mine .bub a{color:#eafff3}
  .msg .tm{font-size:10px;color:#9ca3af;margin-top:3px}
  .msg.mine .tm{text-align:right}
  .card-bub{background:#fff;border-radius:12px;padding:12px;border:1px solid var(--line);max-width:85%;box-shadow:0 2px 8px rgba(17,24,39,.08)}
  .card-bub .cb-hd{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .card-bub .cb-hd .cb-t{font-weight:600;font-size:13px}
  .card-bub .cb-meta{font-size:12px;color:var(--sub);display:flex;gap:12px;margin-bottom:6px}
  .card-bub .cb-meta b{color:var(--amber)}
  .card-bub .cb-req{font-size:12px;color:var(--sub);background:var(--bg);border-radius:8px;padding:7px 9px;margin-bottom:6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card-bub .cb-ops{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
  #chatInputBar{display:flex;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid var(--line);flex-shrink:0;align-items:center}
  #chatInput{flex:1;border-radius:99px;padding:10px 15px}
  .icon-btn{width:38px;height:38px;border-radius:50%;border:none;background:var(--grey-bg);font-size:17px;cursor:pointer;flex-shrink:0;transition:background .15s}
  .icon-btn:hover{background:#e2e8f0}

  /* ===== 考勤 ===== */
  .shift-hero{background:linear-gradient(135deg,#07c160,#059a4e);border-radius:14px;color:#fff;padding:18px;margin-bottom:12px;box-shadow:0 4px 12px rgba(7,193,96,.25)}
  .shift-hero .big{font-size:26px;font-weight:700;letter-spacing:1px}
  .shift-hero .st{font-size:12px;opacity:.85;margin:4px 0 12px}
  .sched-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f3f4f6}
  .sched-row:last-child{border-bottom:none}
  .sched-row .dy{width:56px;font-size:13px;font-weight:500}
  .sched-row input[type=time]{flex:1;padding:6px 8px;font-size:12px}
  table.rec{width:100%;border-collapse:collapse;font-size:12px}
  table.rec th{color:var(--sub);font-weight:500;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
  table.rec td{padding:7px 4px;border-bottom:1px solid #f3f4f6}
  .tag{font-size:11px;padding:2px 8px;border-radius:99px}
  .tg-ok{background:var(--green-bg);color:var(--green-dk)}
  .tg-warn{background:var(--amber-bg);color:var(--amber)}
  .tg-bad{background:var(--red-bg);color:var(--red)}
  .tg-grey{background:var(--grey-bg);color:var(--grey)}

  /* ===== 弹层 ===== */
  .mask{position:fixed;inset:0;background:rgba(17,24,39,.5);display:none;align-items:flex-end;justify-content:center;z-index:100}
  .mask.show{display:flex}
  @media(min-width:640px){.mask{align-items:center}}
  .sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:85vh;overflow-y:auto;padding:18px}
  @media(min-width:640px){.sheet{border-radius:18px}}
  .sheet h3{font-size:15px;margin-bottom:12px}
  .kv{display:flex;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid #f3f4f6}
  .kv .k{color:var(--sub);width:76px;flex-shrink:0}
  .kv .v{flex:1;word-break:break-all}
  .req-box{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6;margin:10px 0;white-space:pre-wrap}
  .sheet .ops{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .sheet .ops .btn{flex:1}
  .close-x{float:right;border:none;background:var(--grey-bg);width:26px;height:26px;border-radius:50%;cursor:pointer;color:var(--sub);font-size:13px}

  #toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(17,24,39,.85);color:#fff;font-size:13px;padding:9px 18px;border-radius:99px;z-index:200;display:none;max-width:80vw;text-align:center}

  @media(max-width:640px){
    #convList{width:120px}
    .conv .last{display:none}
    .stats{gap:8px}
  }
</style>
</head>
<body>
<div id="connBar">⚠ 网络连接断开，正在自动重连…（恢复后无需刷新）</div>

<header class="topbar">
  <div class="logo">✍️</div>
  <div><h1>写手工作台</h1><div class="sub">派单协作系统 V9</div></div>
  <div class="grow"></div>
  <div class="me-badge">
    <span class="dot d-off" id="selfDot"></span>
    <span id="whoami"></span>
    <span class="shift-tag st-off" id="shiftBadge">离班</span>
  </div>
</header>

<main class="main">
  <!-- 聊天 -->
  <section id="pChat" class="panel on">
    <div id="chatLayout">
      <div id="convList"></div>
      <div id="chatRight">
        <div id="chatHead"><span class="dot d-off" id="peerDot"></span><span id="peerName">选择会话</span><span class="sub" id="peerSt"></span></div>
        <div id="chatBox"><div class="empty">左侧选择会话开始沟通</div></div>
        <div id="chatInputBar">
          <button class="icon-btn" id="btnFile" title="发文件">📎</button>
          <input id="chatInput" placeholder="输入消息，回车发送…">
          <button class="icon-btn" id="btnSend" style="background:var(--green);color:#fff" title="发送">➤</button>
          <input type="file" id="fileInput" style="display:none">
        </div>
      </div>
    </div>
  </section>

  <!-- 单子 -->
  <section id="pCards" class="panel">
    <div class="wrap">
      <div class="flow-tip">📋 流程：<b>接单</b> → 做单 → <b>提交审核</b> → 管理员审核 → 审核通过进 <b>待打款</b> → 管理员打款后 <b>已完成</b>；未通过会<b style="color:var(--red)">驳回</b>（附原因，可重新做单）</div>
      <div class="stats">
        <div class="stat v-green"><div class="v" id="sumPaid">0</div><div class="l">已到手 ¥</div></div>
        <div class="stat v-cyan"><div class="v" id="sumPending">0</div><div class="l">待打款 ¥</div></div>
        <div class="stat v-blue"><div class="v" id="sumOngoing">0</div><div class="l">在途 ¥</div></div>
      </div>
      <div id="cardList"></div>
    </div>
  </section>

  <!-- 考勤 -->
  <section id="pAttend" class="panel">
    <div class="wrap">
      <div class="shift-hero">
        <div class="big" id="clockNow">--:--</div>
        <div class="st" id="shiftState">在班标识会实时同步给管理员</div>
        <button class="btn btn-sm" id="btnClock" style="background:#fff;color:var(--green-dk);font-weight:600">打卡上班</button>
      </div>
      <div class="card">
        <h3>📅 我的每周班表</h3>
        <div id="schedRows"></div>
        <div style="text-align:right;margin-top:10px"><button class="btn btn-g btn-sm" id="btnSched">保存班表</button></div>
      </div>
      <div class="card">
        <h3>🗒️ 考勤记录 <input type="month" id="attMonth" style="margin-left:auto;font-size:12px;padding:5px 8px"></h3>
        <div id="attRows"></div>
      </div>
    </div>
  </section>

  <!-- 薪酬 -->
  <section id="pPay" class="panel">
    <div class="wrap">
      <div class="card">
        <h3>💰 月度结算 <input type="month" id="payMonth" style="margin-left:auto;font-size:12px;padding:5px 8px"></h3>
        <div class="stats" style="margin:0">
          <div class="stat v-green"><div class="v" id="pyPaid">0</div><div class="l">已到手 ¥</div></div>
          <div class="stat v-cyan"><div class="v" id="pyPending">0</div><div class="l">待打款 ¥</div></div>
          <div class="stat v-blue"><div class="v" id="pyOngoing">0</div><div class="l">在途 ¥</div></div>
        </div>
      </div>
      <div id="payList"></div>
    </div>
  </section>
</main>

<nav class="tabbar">
  <div class="tab on" data-p="pChat"><span class="ico">💬</span>聊天<span class="reddot" id="tabUnread" style="display:none">0</span></div>
  <div class="tab" data-p="pCards"><span class="ico">📋</span>单子</div>
  <div class="tab" data-p="pAttend"><span class="ico">🕒</span>考勤</div>
  <div class="tab" data-p="pPay"><span class="ico">💰</span>薪酬</div>
</nav>

<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id);
const TOKEN = localStorage.getItem('jdy_token');
const USER = JSON.parse(localStorage.getItem('jdy_user') || 'null');
if (!TOKEN || !USER) location.href = '/login.html';
let ME = null;

function toast(t, ms = 2200) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', ms); }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cnNow = () => new Date(Date.now() + 8 * 3600 * 1000);
const cnDateStr = d => d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
const cnHm = () => { const d = cnNow(); return String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0'); };
const fmtT = d => d ? (new Date(new Date(d).getTime() + 8 * 3600 * 1000).toISOString().slice(5, 16).replace('T', ' ')) : '';
const fmtSize = n => n > 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.round(n / 1024) + 'KB';
const dl = id => '/api/files/' + id + '/download?token=' + encodeURIComponent(TOKEN);
const stPill = st => '<span class="pill st-' + esc(st) + '">' + esc(st) + '</span>';

async function authFetch(url, opt = {}) {
  opt.headers = Object.assign({}, opt.headers, { 'Authorization': 'Bearer ' + TOKEN });
  if (opt.body && !(opt.body instanceof FormData) && !opt.headers['Content-Type']) opt.headers['Content-Type'] = 'application/json';
  const r = await fetch(url, opt);
  if (r.status === 401) { localStorage.removeItem('jdy_token'); localStorage.removeItem('jdy_user'); location.href = '/login.html'; throw new Error('未登录'); }
  const j = await r.json().catch(() => ({ ok: false, error: '响应异常' }));
  if (!j.ok) throw new Error(j.error || '请求失败');
  return j;
}

/* ================= 聊天 ================= */
let chats = [], currentPeer = null, msgs = [], cardsMap = {};
function cacheKey() { return 'jdy_msg_' + (ME ? ME.id : USER.id) + '_' + (currentPeer || 'none'); }
function loadCache() { try { return JSON.parse(localStorage.getItem(cacheKey()) || '[]'); } catch (e) { return []; } }
function saveCache(arr) { try { localStorage.setItem(cacheKey(), JSON.stringify(arr.slice(-600))); } catch (e) {} }

function renderConvList() {
  $('convList').innerHTML = chats.map(c => {
    const u = c.user;
    return `<div class="conv ${c.user.id === currentPeer ? 'on' : ''}" data-id="${u.id}">
      <div class="avatar">${esc((u.displayName || '?')[0])}<span class="dot ${u.sockOnline ? 'd-on' : 'd-off'}"></span></div>
      <div class="info"><div class="nm"><span>${esc(u.displayName)}</span>${u.shift ? '<span class="sh">在班</span>' : ''}</div>
      <div class="last">${c.last ? (c.last.type === 'text' ? esc(c.last.text).slice(0, 18) : c.last.type === 'file' ? '[文件]' : '[派单卡]') : '开始沟通'}</div></div>
      ${c.unread ? '<div class="unread">' + (c.unread > 99 ? '99+' : c.unread) + '</div>' : ''}
    </div>`;
  }).join('') || '<div class="empty">暂无会话</div>';
  document.querySelectorAll('.conv').forEach(el => el.onclick = () => openChat(el.dataset.id));
  const totalUnread = chats.reduce((s, c) => s + (c.unread || 0), 0);
  $('tabUnread').style.display = totalUnread ? 'flex' : 'none';
  $('tabUnread').textContent = totalUnread > 99 ? '99+' : totalUnread;
}
function renderCardBub(c) {
  const s = c.status;
  let ops = '';
  if (s === '待接单') ops = `<button class="btn btn-g btn-sm" onclick="actAccept('${c._id}')">接单</button><button class="btn btn-gh btn-sm" onclick="actDecline('${c._id}')">不接</button>`;
  else if (s === '已接单') ops = `<button class="btn btn-g btn-sm" onclick="actSubmit('${c._id}')">提交审核</button>`;
  else if (s === '已驳回') ops = `<button class="btn btn-r btn-sm" onclick="actRedo('${c._id}')">重新做单</button>`;
  else if (s === '待审核') ops = `<span style="font-size:11px;color:var(--purple)">⏳ 等待管理员审核</span>`;
  else if (s === '待打款') ops = `<span style="font-size:11px;color:var(--cyan)">✅ 审核通过 · 等待打款</span>`;
  return `<div class="card-bub">
    <div class="cb-hd">🃏 <span class="cb-t">${esc(c.title)}</span>${stPill(s)}</div>
    <div class="cb-meta"><span>报酬 <b>¥${c.reward}</b></span>${c.deadline ? '<span>截止 ' + esc(c.deadline) + '</span>' : ''}${c.orderNo ? '<span>单号 ' + esc(c.orderNo) + '</span>' : ''}</div>
    ${c.requirement ? '<div class="cb-req">' + esc(c.requirement) + '</div>' : ''}
    ${s === '已驳回' && c.rejectReason ? '<div class="order-card note warn" style="margin-bottom:6px">❌ 驳回原因：' + esc(c.rejectReason) + '</div>' : ''}
    ${c.fileId ? '<div style="font-size:12px;margin-bottom:6px"><a href="' + dl(c.fileId) + '" target="_blank">📎 ' + esc(c.fileName || '附件') + '</a>（附件云端保留3天）</div>' : ''}
    ${ops ? '<div class="cb-ops">' + ops + '</div>' : ''}
    <div style="text-align:right;margin-top:6px"><a href="javascript:void(0)" onclick="openCard('${c._id}')" style="font-size:11px;color:var(--blue);text-decoration:none">查看详情 ›</a></div>
  </div>`;
}
function renderMsgs(list) {
  if (!currentPeer) return;
  if (!list.length) { $('chatBox').innerHTML = '<div class="empty">还没有消息，打个招呼吧</div>'; return; }
  $('chatBox').innerHTML = list.map(m => {
    if (m.type === 'card') {
      const c = cardsMap[m.cardId];
      return `<div class="msg ${m.from === ME.id ? 'mine' : ''}">${c ? renderCardBub(c) : '<div class="bub">🃏 [派单卡]（详情见「单子」页）</div>'}</div>`;
    }
    if (m.type === 'file') {
      return `<div class="msg ${m.from === ME.id ? 'mine' : ''}"><div class="bub">📎 <a href="${dl(m.fileId)}" target="_blank">${esc(m.fileName)}</a> <span style="font-size:10px;opacity:.7">${fmtSize(m.fileSize)}</span><div class="tm">${fmtT(m.createdAt)}</div></div></div>`;
    }
    return `<div class="msg ${m.from === ME.id ? 'mine' : ''}"><div class="bub">${esc(m.text)}<div class="tm">${fmtT(m.createdAt)}</div></div></div>`;
  }).join('');
  $('chatBox').scrollTop = $('chatBox').scrollHeight;
}
async function loadChats() {
  const j = await authFetch('/api/chats');
  chats = j.chats;
  renderConvList();
  if (!currentPeer && chats.length) openChat(chats[0].user.id);
  if (currentPeer) {
    const c = chats.find(x => x.user.id === currentPeer);
    if (c) { $('peerDot').className = 'dot ' + (c.user.sockOnline ? 'd-on' : 'd-off'); $('peerSt').textContent = (c.user.sockOnline ? '在线' : '离线') + (c.user.shift ? ' · 在班' : ''); }
  }
}
async function openChat(peer) {
  currentPeer = peer;
  const c = chats.find(x => x.user.id === peer);
  $('peerName').textContent = c ? c.user.displayName : '会话';
  $('peerDot').className = 'dot ' + (c && c.user.sockOnline ? 'd-on' : 'd-off');
  $('peerSt').textContent = c ? ((c.user.sockOnline ? '在线' : '离线') + (c.user.shift ? ' · 在班' : '')) : '';
  msgs = loadCache();
  renderMsgs(msgs);
  renderConvList();
  try {
    const j = await authFetch('/api/messages?peer=' + peer);
    const map = new Map(msgs.map(m => [m._id, m]));
    j.messages.forEach(m => map.set(m._id, m));
    msgs = [...map.values()].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
    saveCache(msgs);
    renderMsgs(msgs);
    const ch = chats.find(x => x.user.id === peer); if (ch) { ch.unread = 0; renderConvList(); }
  } catch (e) { toast(e.message); }
  // 拉取卡片数据用于聊天里的卡片气泡
  try { const cj = await authFetch('/api/mycards'); cj.cards.forEach(c => cardsMap[c._id] = c); renderMsgs(msgs); } catch (e) {}
}
async function sendText() {
  const t = $('chatInput').value.trim();
  if (!t || !currentPeer) return;
  $('chatInput').value = '';
  try {
    const j = await authFetch('/api/messages', { method: 'POST', body: JSON.stringify({ peer: currentPeer, text: t }) });
    msgs.push(j.message); saveCache(msgs); renderMsgs(msgs);
  } catch (e) { toast(e.message); $('chatInput').value = t; }
}
async function sendFile(f) {
  if (!f || !currentPeer) return;
  if (f.size > 25 * 1024 * 1024) return toast('文件不能超过25MB');
  toast('上传中：' + f.name + '…', 8000);
  const fd = new FormData(); fd.append('file', f); fd.append('peer', currentPeer);
  try {
    const up = await authFetch('/api/files', { method: 'POST', body: fd });
    const j = await authFetch('/api/messages/file', { method: 'POST', body: JSON.stringify({ peer: currentPeer, fileId: up.fileId, fileName: up.fileName, fileSize: up.fileSize }) });
    msgs.push(j.message); saveCache(msgs); renderMsgs(msgs);
    toast('发送成功');
  } catch (e) { toast('上传失败：' + e.message); }
}

/* ================= 派单卡（写手侧操作） ================= */
async function reloadCards() {
  try {
    const j = await authFetch('/api/mycards');
    cardsMap = {}; j.cards.forEach(c => cardsMap[c._id] = c);
    const sum = { paid: 0, pending: 0, ongoing: 0 };
    j.cards.forEach(c => {
      if (c.status === '已完成') sum.paid += c.reward;
      else if (c.status === '待打款') sum.pending += c.reward;
      else if (['待接单', '已接单', '待审核'].includes(c.status)) sum.ongoing += c.reward;
    });
    $('sumPaid').textContent = sum.paid; $('sumPending').textContent = sum.pending; $('sumOngoing').textContent = sum.ongoing;
    const list = j.cards.length ? j.cards.map(c => cardRow(c)).join('') : '<div class="empty">还没有派单卡，等管理员派单吧</div>';
    $('cardList').innerHTML = list;
    renderMsgs(msgs);
  } catch (e) { toast(e.message); }
}
function cardRow(c) {
  let note = '';
  if (c.status === '已驳回' && c.rejectReason) note = '<div class="note warn">❌ 驳回原因：' + esc(c.rejectReason) + '</div>';
  else if (c.status === '已接单' && c.rejectReason) note = '<div class="note">↩️ 上次被驳回：' + esc(c.rejectReason) + '</div>';
  let ops = '';
  if (c.status === '待接单') ops = `<button class="btn btn-g btn-sm" onclick="actAccept('${c._id}')">接单</button><button class="btn btn-gh btn-sm" onclick="actDecline('${c._id}')">不接</button>`;
  else if (c.status === '已接单') ops = `<button class="btn btn-g btn-sm" onclick="actSubmit('${c._id}')">提交审核</button>`;
  else if (c.status === '已驳回') ops = `<button class="btn btn-r btn-sm" onclick="actRedo('${c._id}')">重新做单</button>`;
  return `<div class="order-card">
    <div class="hd"><span class="t">${esc(c.title)}</span>${stPill(c.status)}</div>
    <div class="meta"><span>报酬 <b>¥${c.reward}</b></span>${c.deadline ? '<span>📅 截止 ' + esc(c.deadline) + '</span>' : ''}${c.orderNo ? '<span>🔗 台账单 ' + esc(c.orderNo) + '</span>' : ''}<span>${fmtT(c.createdAt)}</span></div>
    ${note}
    <div class="ops">${ops}<button class="btn btn-gh btn-sm" onclick="openCard('${c._id}')">详情</button></div>
  </div>`;
}
window.openCard = id => {
  const c = cardsMap[id]; if (!c) return;
  let ops = '';
  if (c.status === '待接单') ops = `<button class="btn btn-g" onclick="actAccept('${id}')">接单</button><button class="btn btn-gh" onclick="actDecline('${id}')">不接</button>`;
  else if (c.status === '已接单') ops = `<button class="btn btn-g" onclick="actSubmit('${id}')">提交审核</button>`;
  else if (c.status === '已驳回') ops = `<button class="btn btn-r" onclick="actRedo('${id}')">重新做单</button>`;
  else if (c.status === '待审核') ops = '<span style="color:var(--purple);font-size:13px">⏳ 已提交，等待管理员审核</span>';
  else if (c.status === '待打款') ops = '<span style="color:var(--cyan);font-size:13px">✅ 审核已通过，等待管理员打款</span>';
  $('sheet').innerHTML = `<button class="close-x" onclick="closeSheet()">✕</button>
    <h3>${esc(c.title)} ${stPill(c.status)}</h3>
    <div class="kv"><span class="k">报酬</span><span class="v" style="color:var(--amber);font-weight:700">¥${c.reward}</span></div>
    ${c.deadline ? '<div class="kv"><span class="k">截止日期</span><span class="v">' + esc(c.deadline) + '</span></div>' : ''}
    ${c.orderNo ? '<div class="kv"><span class="k">关联台账单</span><span class="v">' + esc(c.orderNo) + '（' + esc(c.orderDate || '') + '）</span></div>' : ''}
    ${c.requirement ? '<div style="margin-top:10px;font-size:12px;color:var(--sub)">任务要求</div><div class="req-box">' + esc(c.requirement) + '</div>' : ''}
    ${c.status === '已驳回' && c.rejectReason ? '<div class="req-box" style="background:var(--red-bg);color:var(--red)">❌ 驳回原因：' + esc(c.rejectReason) + '</div>' : ''}
    ${c.fileId ? '<div class="kv"><span class="k">附件</span><span class="v"><a href="' + dl(c.fileId) + '" target="_blank" style="color:var(--blue)">📎 ' + esc(c.fileName || '下载附件') + '</a></span></div>' : ''}
    <div class="ops">${ops || ''}</div>`;
  $('mask').classList.add('show');
};
window.closeSheet = () => $('mask').classList.remove('show');
$('mask').onclick = e => { if (e.target === $('mask')) closeSheet(); };

async function cardAct(id, path, body) {
  try {
    const j = await authFetch('/api/cards/' + id + '/' + path, { method: 'POST', body: JSON.stringify(body || {}) });
    cardsMap[id] = j.card;
    closeSheet(); toast('操作成功');
    await Promise.all([reloadCards(), loadChats()]);
  } catch (e) { toast(e.message); }
}
window.actAccept = id => cardAct(id, 'accept');
window.actDecline = id => { if (confirm('确定不接这个单子吗？')) cardAct(id, 'decline'); };
window.actSubmit = id => {
  const note = prompt('给管理员捎句话（选填，如完成说明）：') ?? '';
  cardAct(id, 'submit', { note });
};
window.actRedo = id => cardAct(id, 'redo');

/* ================= 考勤 ================= */
const WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
let sched = {};
async function loadShiftAndSched() {
  try {
    const sj = await authFetch('/api/schedule');
    sched = sj.schedule || {};
    renderSched();
    await loadAtt();
  } catch (e) { toast(e.message); }
}
function renderSched() {
  $('schedRows').innerHTML = WD.map((w, i) => {
    const d = sched[String(i)] || {};
    return `<div class="sched-row"><span class="dy">${w}</span>
      <input type="checkbox" data-day="${i}" ${d.start ? 'checked' : ''}>
      <input type="time" data-s="${i}" value="${d.start || '09:00'}" ${d.start ? '' : 'disabled'}>
      <span style="color:var(--sub)">至</span>
      <input type="time" data-e="${i}" value="${d.end || '18:00'}" ${d.start ? '' : 'disabled'}>
    </div>`;
  }).join('');
  document.querySelectorAll('#schedRows input[type=checkbox]').forEach(cb => cb.onchange = () => {
    document.querySelector(`[data-s="${cb.dataset.day}"]`).disabled = !cb.checked;
    document.querySelector(`[data-e="${cb.dataset.day}"]`).disabled = !cb.checked;
  });
}
$('btnSched').onclick = async () => {
  const days = {};
  for (let i = 0; i < 7; i++) {
    if (document.querySelector(`#schedRows input[data-day="${i}"]`).checked) {
      days[String(i)] = { start: document.querySelector(`[data-s="${i}"]`).value, end: document.querySelector(`[data-e="${i}"]`).value };
    }
  }
  try { await authFetch('/api/schedule', { method: 'POST', body: JSON.stringify({ days }) }); toast('班表已保存'); loadShiftAndSched(); } catch (e) { toast(e.message); }
};
async function loadAtt() {
  try {
    const j = await authFetch('/api/attendance?month=' + $('attMonth').value);
    const today = cnDateStr(cnNow());
    const t = j.rows.find(r => r.date === today);
    const b = $('btnClock');
    if (t && t.clockIn && !t.clockOut) { b.textContent = '打卡下班'; b.onclick = doClockout; $('shiftState').textContent = '🟢 在班中 · 上班 ' + t.clockIn + (t.status !== '出勤' ? '（' + t.status + '）' : ''); }
    else if (t && t.clockOut) { b.textContent = '今日已签退'; b.disabled = true; $('shiftState').textContent = '今日 ' + t.clockIn + ' ~ ' + t.clockOut + '（' + t.status + '）'; }
    else { b.textContent = '打卡上班'; b.disabled = false; b.onclick = doClockin; $('shiftState').textContent = t ? ('当前状态：' + t.status) : '未打卡'; }
    const tag = s => s === '出勤' ? '<span class="tag tg-ok">出勤</span>' : s === '迟到' || s === '早退' || s === '未签退' ? '<span class="tag tg-warn">' + s + '</span>' : s === '旷工' ? '<span class="tag tg-bad">旷工</span>' : '<span class="tag tg-grey">' + esc(s || '待定') + '</span>';
    $('attRows').innerHTML = j.rows.length ? '<table class="rec"><tr><th>日期</th><th>班段</th><th>上班</th><th>下班</th><th>状态</th></tr>' +
      j.rows.map(r => `<tr><td>${esc(r.date)}${r.date === today ? ' <span style="color:var(--green-dk)">今</span>' : ''}</td><td>${esc(r.planStart || '--')}~${esc(r.planEnd || '--')}</td><td>${esc(r.clockIn || '—')}</td><td>${esc(r.clockOut || '—')}</td><td>${tag(r.status)}</td></tr>`).join('') + '</table>'
      : '<div class="empty">本月暂无考勤记录</div>';
  } catch (e) { toast(e.message); }
}
async function doClockin() {
  try { await authFetch('/api/attendance/clockin', { method: 'POST', body: '{}' }); toast('已打卡上班 ✅'); ME.shift = true; paintMe(); loadShiftAndSched(); } catch (e) { toast(e.message); }
}
async function doClockout() {
  try { const j = await authFetch('/api/attendance/clockout', { method: 'POST', body: '{}' }); toast('已签退（' + j.status + '）'); ME.shift = false; paintMe(); loadShiftAndSched(); } catch (e) { toast(e.message); }
}
$('attMonth').onchange = loadAtt;

/* ================= 薪酬 ================= */
async function loadPay() {
  try {
    const j = await authFetch('/api/payroll?month=' + $('payMonth').value);
    $('pyPaid').textContent = j.totals.paid; $('pyPending').textContent = j.totals.pending; $('pyOngoing').textContent = j.totals.ongoing;
    $('payList').innerHTML = j.cards.length ? j.cards.map(c => cardRow(c)).join('') : '<div class="empty">本月暂无派单记录</div>';
  } catch (e) { toast(e.message); }
}
$('payMonth').onchange = loadPay;

/* ================= 顶栏状态 ================= */
function paintMe() {
  $('whoami').textContent = ME.displayName || ME.username;
  $('selfDot').className = 'dot d-on';
  const sb = $('shiftBadge');
  sb.textContent = ME.shift ? '在班' : '离班';
  sb.className = 'shift-tag ' + (ME.shift ? 'st-on' : 'st-off');
}

/* ================= Tab切换 ================= */
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(x => x.classList.remove('on'));
  t.classList.add('on');
  $(t.dataset.p).classList.add('on');
  if (t.dataset.p === 'pCards') reloadCards();
  if (t.dataset.p === 'pAttend') { $('attMonth').value = cnDateStr(cnNow()).slice(0, 7); loadShiftAndSched(); }
  if (t.dataset.p === 'pPay') { $('payMonth').value = cnDateStr(cnNow()).slice(0, 7); loadPay(); }
});

/* ================= 实时推送 + 链接稳定性 ================= */
const socket = io({
  auth: { token: TOKEN },
  reconnection: true, reconnectionAttempts: Infinity,
  reconnectionDelay: 800, reconnectionDelayMax: 5000, randomizationFactor: 0.5,
  timeout: 20000,
});
socket.on('connect', async () => {
  $('connBar').classList.remove('on');
  if (ME) { toast('已恢复连接 ✅'); paintMe(); }
  try { const j = await authFetch('/api/me'); ME = j.user; paintMe(); } catch (e) {}
  loadChats().catch(() => {});
  reloadCards().catch(() => {});
});
socket.on('disconnect', reason => { $('connBar').classList.add('on'); });
socket.on('connect_error', () => { $('connBar').classList.add('on'); });
socket.on('reconnect', () => { $('connBar').classList.remove('on'); });

socket.on('msg', m => {
  if (currentPeer && (m.from === currentPeer || m.to === currentPeer)) {
    if (!msgs.find(x => x._id === m._id)) { msgs.push(m); saveCache(msgs); renderMsgs(msgs); }
  }
  loadChats().catch(() => {});
  if (m.type === 'file') toast((m.fromName || '') + ' 发来文件：' + m.fileName);
});
socket.on('card', c => { cardsMap[c._id] = c; renderMsgs(msgs); if ($('pCards').classList.contains('on')) reloadCards(); toast('派单卡更新：' + c.title + ' → ' + c.status); });
socket.on('presence', p => {
  if (p.userId === ME.id) { if (p.shift !== undefined) { ME.shift = p.shift; paintMe(); } return; }
  const c = chats.find(x => x.user.id === p.userId);
  if (c) {
    if (p.sockOnline !== undefined) c.user.sockOnline = p.sockOnline;
    if (p.shift !== undefined) c.user.shift = p.shift;
    renderConvList();
    if (p.userId === currentPeer) {
      $('peerDot').className = 'dot ' + (c.user.sockOnline ? 'd-on' : 'd-off');
      $('peerSt').textContent = (c.user.sockOnline ? '在线' : '离线') + (c.user.shift ? ' · 在班' : '');
    }
  }
});

/* ================= 输入事件 ================= */
$('btnSend').onclick = sendText;
$('chatInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });
$('btnFile').onclick = () => $('fileInput').click();
$('fileInput').onchange = e => { const f = e.target.files[0]; if (f) sendFile(f); e.target.value = ''; };

/* ================= 启动 ================= */
(async () => {
  const j = await authFetch('/api/me');
  ME = j.user;
  paintMe();
  loadChats().catch(e => toast(e.message));
  reloadCards().catch(() => {});
  setInterval(() => { $('clockNow').textContent = cnHm(); }, 1000);
})();
</script>
</body>
</html>
