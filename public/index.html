<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>台账 · 订单统计系统</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#faf7f1">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/admin/app.css">
<style>
  /* 【v20.9】本页已改为薄壳：整页逻辑与后台「台账」面板共用 /admin/mod-orders.js
     （样式走 Shadow DOM + /admin/ledger.css）。这里只负责独立打开时的外层留白与面包屑。 */
  body { padding: 20px 16px 60px; }
  .page { max-width: 1400px; margin: 0 auto; }
  .crumb { font-size: 12.5px; color: var(--ink2); margin-bottom: 10px; }
  .crumb a { color: var(--green2); }
</style>
</head>
<body>
<div class="page">
  <div class="crumb"><a href="/admin.html">🏠 工作台</a> / 台账</div>
  <div id="ledgerRoot"><div class="skeleton"><i></i><i></i><i></i><i></i></div></div>
</div>
<script type="module">
  import { guardAdmin } from '/admin/app.js';
  import { mount } from '/admin/mod-orders.js';
  if (guardAdmin()) mount(document.getElementById('ledgerRoot'));
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("/service-worker.js").catch(function () {}); });
}
</script>
</body>
</html>
