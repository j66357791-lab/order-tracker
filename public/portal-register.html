<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 · 小沐文案</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --paper:#faf7f1; --ink:#2b2a26; --ink2:#6b675e; --green:#1f4d3a; --line:#e5ddcc; --red:#b5432f; }
  body { background: var(--paper); color: var(--ink); font: 15px/1.75 "PingFang SC","Microsoft YaHei",sans-serif; min-height: 100vh; }
  .layout { display: flex; max-width: 960px; margin: 0 auto; min-height: 100vh; }
  .poster { flex: 1; position: relative; display: none; }
  .poster img { width: 100%; height: 100vh; object-fit: cover; }
  .poster .p-mask { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 60%, rgba(43,42,38,.55)); }
  .poster .p-quote { position: absolute; bottom: 36px; left: 36px; color: #fff; }
  .poster .p-quote b { font-size: 24px; display: block; font-family: "Songti SC", serif; letter-spacing: 2px; }
  .poster .p-quote span { font-size: 13px; opacity: .85; }
  .form-side { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 48px 44px; }
  .back { font-size: 13px; color: var(--ink2); margin-bottom: 28px; display: inline-block; }
  h1 { font-family: "Songti SC", serif; font-size: 30px; letter-spacing: 2px; margin-bottom: 8px; }
  .sub { color: var(--ink2); font-size: 14px; margin-bottom: 30px; }
  .f-row { margin-bottom: 16px; }
  .f-row label { display: block; font-size: 12.5px; color: var(--ink2); margin-bottom: 6px; }
  .f-row input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; font-size: 15px; outline: none; background: #fff; }
  .f-row input:focus { border-color: var(--green); }
  .btn { background: var(--green); color: #fff; border: none; border-radius: 10px; padding: 14px; font-size: 16px; width: 100%; cursor: pointer; margin-top: 8px; }
  .alt { margin-top: 22px; font-size: 13px; color: var(--ink2); }
  .alt a { color: var(--green); }
  .writer-note { margin-top: 30px; padding: 12px 14px; background: #f3eee3; border-radius: 10px; font-size: 12.5px; color: var(--ink2); line-height: 1.7; }
  .err { color: var(--red); font-size: 13px; min-height: 20px; margin-bottom: 6px; }
  .toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 22px; border-radius: 99px; font-size: 13px; display: none; }
  @media (min-width: 780px) { .poster { display: block; } }
</style>
</head>
<body>
<div class="layout">
  <div class="poster">
    <img src="/assets/portal/poster.png?v=1" alt="小沐文案">
    <div class="p-mask"></div>
    <div class="p-quote"><b>让每一句话，都有人读。</b><span>—— 小沐文案工作室</span></div>
  </div>
  <div class="form-side">
    <a class="back" href="/portal.html">← 回到首页</a>
    <h1>加入小沐</h1>
    <div class="sub">10 秒创建账号，咨询、下单、追进度都在这里</div>
    <div class="err" id="err"></div>
    <div class="f-row"><label>怎么称呼你</label><input id="rgName" maxlength="20" placeholder="昵称（选填）"></div>
    <div class="f-row"><label>手机号（登录账号）</label><input id="rgUser" maxlength="11" placeholder="11 位手机号" inputmode="numeric"></div>
    <div class="f-row"><label>设置密码</label><input id="rgPwd" type="password" maxlength="30" placeholder="至少 6 位"></div>
    <button class="btn" id="go">创建账号</button>
    <div class="alt">已有账号？<a href="/portal.html">回首页登录</a></div>
    <div class="writer-note">✍️ 你是写手？写手注册需要工作室邀请码，请从 <a href="/login.html" style="color:var(--green)">邀请入口</a> 进入。</div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = id => document.getElementById(id);
$('go').onclick = async () => {
  $('err').textContent = '';
  const phone = $('rgUser').value.trim(), pwd = $('rgPwd').value, name = $('rgName').value.trim();
  if (!/^1[3-9]\d{9}$/.test(phone)) { $('err').textContent = '手机号格式不对，检查一下～'; return; }
  if (pwd.length < 6) { $('err').textContent = '密码至少 6 位'; return; }
  $('go').disabled = true; $('go').textContent = '创建中…';
  try {
    const r = await fetch('/api/portal/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: phone, phone, password: pwd, displayName: name }) });
    const j = await r.json();
    if (!j.ok) { $('err').textContent = j.error; $('go').disabled = false; $('go').textContent = '创建账号'; return; }
    localStorage.setItem('jdy_token', j.token);
    localStorage.setItem('jdy_user', JSON.stringify(j.user));
    const t = $('toast'); t.textContent = '欢迎加入小沐 ✓'; t.style.display = 'block';
    setTimeout(() => location.href = '/portal.html', 700);
  } catch (e) { $('err').textContent = '网络开小差了，再试一次'; $('go').disabled = false; $('go').textContent = '创建账号'; }
};
</script>
</body>
</html>
