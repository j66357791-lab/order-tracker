<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>广告管理 · 管理后台</title>
<meta name="robots" content="noindex">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --paper:#faf7f1; --paper2:#f3eee3; --ink:#2b2a26; --ink2:#6b675e; --green:#1f4d3a; --line:#e5ddcc; }
  body { font:15px/1.75 'PingFang SC','Microsoft YaHei',sans-serif; background:var(--paper); color:var(--ink); }
  .wrap { max-width:760px; margin:0 auto; padding:20px 16px 50px; }
  .crumb { font-size:12.5px; color:var(--ink2); margin-bottom:6px; }
  .crumb a { color:var(--green2); cursor:pointer; }
  h1 { font-size:21px; font-family:'Songti SC',serif; margin-bottom:14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:16px; }
  h3 { font-size:16px; margin-bottom:6px; }
  .flow-tip { font-size:12.5px; color:var(--ink2); line-height:1.8; margin-bottom:10px; }
  input, textarea { font-size:14px; border-radius:10px; border:1px solid var(--line); padding:10px 12px; outline:none; width:100%; background:var(--paper); font-family:inherit; }
  textarea { resize:vertical; }
  .btn { font-size:13.5px; border:none; border-radius:10px; padding:9px 18px; cursor:pointer; background:var(--green); color:#fff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="crumb"><a onclick="goHome()">🏠 工作台</a> / 广告管理</div>
  <h1>📝 广告管理</h1>
  <div class="card">
    <h3>编辑广告内容</h3>
    <div class="flow-tip">广告会显示在写手端「活动中心」页面，支持 HTML 标签。</div>
    <input id="adTitle" placeholder="广告标题" style="margin-bottom:9px">
    <textarea id="adContent" rows="12" placeholder="广告内容（支持HTML）" style="margin-bottom:10px"></textarea>
    <button class="btn" id="btnSaveAd">保存广告</button>
  </div>
  <div class="card">
    <h3>预览</h3>
    <div id="adPreview" style="border:1px solid var(--line);border-radius:10px;padding:12px;min-height:100px"></div>
  </div>
</div>
<div class="toast" id="toast" style="position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#2b2a26;color:#fff;padding:9px 20px;border-radius:99px;font-size:13px;display:none;z-index:99"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TOKEN = localStorage.getItem('jdy_token');
const USER = JSON.parse(localStorage.getItem('jdy_user') || 'null');
const EMBED = location.search.includes('embed=1');
function toast(t) { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(e._t); e._t = setTimeout(() => e.style.display = 'none', 2400); }
function goHome() { if (EMBED && window.parent !== window) { try { window.parent.navGo('home'); return; } catch (e) {} } location.href = '/admin.html'; }
function goLogin() { if (EMBED && window.parent !== window) { try { window.parent.location.href = '/login.html'; return; } catch (e) {} } location.href = '/login.html'; }
if (!TOKEN || !USER || USER.role !== 'admin') goLogin();
async function authFetch(url, opt) {
  opt = opt || {};
  opt.headers = Object.assign({}, opt.headers, { 'Authorization': 'Bearer ' + TOKEN });
  if (opt.body && typeof opt.body !== 'string') { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(opt.body); }
  const r = await fetch(url, opt);
  if (r.status === 401) { localStorage.removeItem('jdy_token'); localStorage.removeItem('jdy_user'); goLogin(); throw new Error('未登录'); }
  const j = await r.json().catch(() => ({ ok: false, error: '响应异常' }));
  if (!j.ok) throw new Error(j.error || '请求失败');
  return j;
}
async function loadAdAdmin() {
  try {
    const j = await authFetch('/api/ads');
    $('adTitle').value = j.ad.title || '';
    $('adContent').value = j.ad.content || '';
    renderAdPreview();
  } catch (e) { toast(e.message); }
}
function renderAdPreview() {
  $('adPreview').innerHTML = '<h4 style="font-size:15px;margin-bottom:8px">' + esc($('adTitle').value) + '</h4>' + $('adContent').value;
}
$('adContent').oninput = renderAdPreview;
$('btnSaveAd').onclick = async () => {
  try {
    await authFetch('/api/ads', { method: 'POST', body: JSON.stringify({ title: $('adTitle').value, content: $('adContent').value }) });
    toast('广告已保存 ✅');
  } catch (e) { toast(e.message); }
};
loadAdAdmin();
</script>
</body>
</html>
