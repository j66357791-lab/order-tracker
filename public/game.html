<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>魔法翻翻乐</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    background:#1a0b2e; color:#f3e9ff; overflow-x:hidden;
    min-height:100vh;
    background-image:url('/assets/game/bg_main.jpg');
    background-size:100% auto; background-repeat:no-repeat; background-color:#160824;
  }
  .wrap { max-width:480px; margin:0 auto; padding:16px 14px 40px; }
  .hidden { display:none !important; }

  /* ===== 顶部 ===== */
  .topbar { display:flex; justify-content:space-between; align-items:center; }
  .title { font-size:26px; font-weight:800; color:#ffd76a; text-shadow:0 2px 8px rgba(255,180,40,.55), 0 0 18px rgba(255,200,80,.35); letter-spacing:2px; }
  .act-time { font-size:11px; color:#c9b3e8; background:rgba(30,12,55,.65); border:1px solid rgba(255,215,106,.35); border-radius:20px; padding:3px 10px; margin-top:4px; display:inline-block; }
  .btn-back { color:#e6d6ff; background:rgba(30,12,55,.65); border:1px solid rgba(200,160,255,.4); border-radius:20px; padding:6px 14px; font-size:13px; cursor:pointer; }

  /* ===== 道具栏 ===== */
  .inv { display:flex; gap:8px; margin-top:14px; }
  .inv-item { flex:1; background:rgba(30,12,55,.72); border:1px solid rgba(255,215,106,.28); border-radius:12px; padding:8px 4px; text-align:center; }
  .inv-item img { width:34px; height:34px; object-fit:contain; filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  .inv-item .num { font-size:14px; font-weight:700; color:#ffd76a; }
  .inv-item .lbl { font-size:10px; color:#c9b3e8; }

  /* ===== 任务条 ===== */
  .task-bar { margin-top:12px; display:flex; align-items:center; gap:10px; background:linear-gradient(90deg, rgba(58,28,102,.85), rgba(38,16,72,.85)); border:1px solid rgba(255,215,106,.35); border-radius:14px; padding:10px 12px; }
  .task-bar img { width:36px; height:36px; }
  .task-bar .t-info { flex:1; }
  .task-bar .t-name { font-size:14px; font-weight:600; }
  .task-bar .t-desc { font-size:11px; color:#c9b3e8; margin-top:2px; }
  .btn { border:none; border-radius:20px; padding:8px 18px; font-size:14px; font-weight:700; cursor:pointer; color:#3a1c02; background:linear-gradient(180deg,#ffe08a,#f7b733); box-shadow:0 3px 10px rgba(247,183,51,.4); }
  .btn:active { transform:scale(.96); }
  .btn[disabled] { background:#5a4a75; color:#a99cc0; box-shadow:none; cursor:not-allowed; }
  .btn-ghost { background:transparent; border:1px solid rgba(200,160,255,.5); color:#e6d6ff; box-shadow:none; }
  .btn-danger { background:linear-gradient(180deg,#ff8f8f,#e04b4b); color:#fff; box-shadow:0 3px 10px rgba(224,75,75,.4); }

  /* ===== 开始区 ===== */
  .start-zone { text-align:center; margin-top:22px; }
  .btn-start { font-size:19px; padding:14px 52px; border-radius:30px; letter-spacing:2px; }
  .start-tip { font-size:11px; color:#b9a3d8; margin-top:10px; line-height:1.7; }

  /* ===== 对局区（【v22.0】专属翻牌空间：进入后是一整个沉浸式场景，不再挤在长页里） ===== */
  #pageGame { position:fixed; inset:0; z-index:30; display:flex; flex-direction:column;
    padding:12px 12px 14px; background:radial-gradient(130% 72% at 50% 0%, #4a2385 0%, #2a1250 44%, #150826 100%); }
  .pg-top { display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
  .pg-mid { text-align:center; }
  .snd-btn { width:40px; height:40px; border-radius:50%; border:1px solid rgba(200,160,255,.45); background:rgba(30,12,55,.65); color:#ffd76a; font-size:17px; cursor:pointer; flex-shrink:0; }
  .snd-btn.off { color:#8f7bad; }
  .game-head { display:flex; justify-content:center; align-items:center; gap:14px; margin-top:12px; flex-shrink:0; }
  .wave-tag { font-size:15px; font-weight:800; color:#ffd76a; letter-spacing:1px; text-shadow:0 0 12px rgba(255,215,106,.55); }
  .round-dots { display:flex; gap:7px; }
  .dot { width:11px; height:11px; border-radius:50%; background:rgba(255,255,255,.16); border:1px solid rgba(255,215,106,.4); transition:all .25s; }
  .dot.cur { background:#ffd76a; box-shadow:0 0 10px rgba(255,215,106,.85); transform:scale(1.15); }
  .dot.done { background:#7ee08a; }
  .pot { margin:12px auto 8px; width:100%; max-width:600px; background:rgba(30,12,55,.78); border:1px dashed rgba(255,215,106,.45); border-radius:14px; padding:10px 14px; font-size:12.5px; color:#e6d6ff; text-align:center; flex-shrink:0; }
  .pot b { color:#ffd76a; font-size:14px; }
  .pot .empty { color:#8f7bad; }

  .cards { flex:1; display:grid; grid-template-columns:repeat(5,1fr); gap:10px; align-content:center;
    width:100%; max-width:600px; margin:0 auto; padding:14px;
    background:rgba(22,8,36,.45); border:1px solid rgba(255,215,106,.22); border-radius:18px; backdrop-filter:blur(2px); }
  .card { aspect-ratio:3/4.1; perspective:700px; cursor:pointer; transition:transform .18s ease; }
  .card:not(.disabled):hover { transform:translateY(-5px); }
  .card:not(.disabled):active { transform:scale(.96); }
  .card-inner { position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .6s cubic-bezier(.4,.2,.2,1); }
  .card.open .card-inner { transform:rotateY(180deg); }
  .card-face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:12px; overflow:hidden; background:#241040; box-shadow:0 4px 14px rgba(0,0,0,.45); }
  .card-face img { width:100%; height:100%; object-fit:cover; display:block; }
  .card-front-face { transform:rotateY(180deg); display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .card-front-face img.bg { position:absolute; inset:0; }
  .card-front-face .prize { position:relative; width:58%; margin-top:6%; }
  .card-front-face .prize-txt { position:relative; font-size:11.5px; font-weight:700; color:#ffd76a; text-shadow:0 1px 3px #000; margin-top:6px; text-align:center; padding:0 2px; }
  .card.disabled { pointer-events:none; }
  .pg-tip { flex-shrink:0; text-align:center; font-size:11.5px; color:#b9a3d8; padding-top:10px; }

  /* ===== 音效开关（【v22.0】） ===== */
  .task-row { display:flex; align-items:center; gap:10px; padding:10px; background:#f8f9fa; border-radius:12px; }
  .task-row img { width:32px; height:32px; }
  .task-row .ti { flex:1; text-align:left; }
  .task-row .tt { font-size:13px; font-weight:600; }
  .task-row .td { font-size:11px; color:#999; margin-top:2px; }
  .task-row .tr { text-align:right; }
  .task-row .rw { font-size:11px; color:#d97706; font-weight:700; margin-bottom:4px; }

  /* ===== 弹窗 ===== */
  .mask { position:fixed; inset:0; background:rgba(10,4,22,.78); display:flex; align-items:center; justify-content:center; z-index:50; padding:24px; }
  .modal { width:100%; max-width:340px; background:linear-gradient(170deg,#31195a,#221040); border:1px solid rgba(255,215,106,.45); border-radius:18px; padding:22px 18px; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.6); }
  .modal img.m-ico { width:76px; height:76px; object-fit:contain; }
  .modal h3 { font-size:19px; color:#ffd76a; margin:10px 0 6px; }
  .modal p { font-size:13px; color:#d8c8f0; line-height:1.7; }
  .modal .m-btns { display:flex; gap:10px; justify-content:center; margin-top:16px; }
  .gain-list { margin:12px auto 0; display:flex; flex-wrap:wrap; gap:8px 16px; justify-content:center; font-size:13px; }
  .gain-list span { color:#7ee08a; font-weight:700; }

  /* ===== 商铺 ===== */
  .shop-list { margin-top:14px; display:flex; flex-direction:column; gap:10px; }
  .shop-item { display:flex; align-items:center; gap:12px; background:rgba(30,12,55,.75); border:1px solid rgba(255,215,106,.28); border-radius:14px; padding:10px 12px; }
  .shop-item img { width:46px; height:46px; object-fit:contain; }
  .shop-item .s-info { flex:1; }
  .shop-item .s-name { font-size:14px; font-weight:600; }
  .shop-item .s-desc { font-size:11px; color:#c9b3e8; margin-top:2px; }
  .s-cost { font-size:12px; color:#ffd76a; font-weight:700; margin-top:3px; }
  .compose-bar { margin-top:12px; display:flex; align-items:center; gap:10px; background:rgba(30,12,55,.75); border:1px solid rgba(126,224,138,.35); border-radius:14px; padding:10px 12px; }
  .toast { position:fixed; left:50%; bottom:12%; transform:translateX(-50%); background:rgba(20,8,40,.92); border:1px solid rgba(255,215,106,.5); color:#ffd76a; font-size:13px; padding:9px 18px; border-radius:22px; z-index:99; }
  .bag-open-txt { font-size:26px; font-weight:800; color:#ffd76a; text-shadow:0 0 14px rgba(255,200,80,.6); }
  /* 序列帧粒子特效层 */
  #fx { position:fixed; inset:0; pointer-events:none; z-index:998; }
</style>
</head>
<body>
<div class="wrap">
  <!-- ========= 主页 ========= -->
  <div id="pageHome">
    <div class="topbar">
      <div>
        <div class="title">✨ 魔法翻翻乐</div>
        <span class="act-time" id="actTime"></span>
      </div>
      <button class="btn-back snd-btn" id="btnSndHome" onclick="toggleSnd()" title="音效 / 音乐开关">🔊</button>
      <button class="btn-back" onclick="exitToWriter()">退出</button>
    </div>
    <div class="inv" id="invBar"></div>
    <div class="task-bar">
      <img src="/assets/game/icon_key.png" alt="">
      <div class="t-info">
        <div class="t-name">每日任务 · 领取魔法钥匙</div>
        <div class="t-desc">每天可免费领取 1 把魔法钥匙</div>
      </div>
      <button class="btn" id="btnDaily" onclick="claimDaily()">领取</button>
    </div>
    <!-- 任务专区（【v22.0】后台可配置，条目来自任务专区配置） -->
    <div class="task-bar" style="margin-top:10px">
      <img src="/assets/game/icon_key.png" alt="">
      <div class="t-info">
        <div class="t-name">📋 任务专区</div>
        <div class="t-desc" id="taskBarDesc">每日登录领钥匙 · 完成游戏赢碎片 · 邀请好友得奖励</div>
      </div>
      <button class="btn btn-ghost" onclick="showTasks()">查看全部</button>
    </div>
    <!-- 开始区：点击进入专属翻牌空间 -->
    <div class="start-zone">
      <button class="btn btn-start" id="btnStart" onclick="startGame()">开始翻牌</button>
      <div class="start-tip">
        消耗 1 把魔法钥匙开启一局 · 三波翻牌，越往后奖励越大<br>
        翻到「奖励逃跑了」本局奖励清零 · 复活石可抵消一次逃跑（每局限 2 次）<br>
        集齐 30 个魔法球碎片可合成 1 个魔法球，魔法球可在魔法商铺兑换奖励
      </div>
      <div style="margin-top:14px; display:flex; gap:10px; justify-content:center;">
        <button class="btn btn-ghost" onclick="showShop()">🛒 魔法商铺</button>
        <button class="btn btn-ghost" onclick="openBags()">🧧 拆福袋</button>
      </div>
    </div>
  </div>

  <!-- ========= 对局页（【v22.0】专属翻牌空间：全屏沉浸场景） ========= -->
  <div id="pageGame" class="hidden">
    <div class="pg-top">
      <button class="btn-back" onclick="backHome()">← 离开</button>
      <div class="pg-mid">
        <div class="title" style="font-size:19px;">✨ 魔法翻翻乐</div>
      </div>
      <button class="snd-btn" id="btnSndGame" onclick="toggleSnd()" title="音效 / 音乐开关">🔊</button>
    </div>
    <div class="game-head">
      <span class="wave-tag" id="waveTag">第一波</span>
      <div class="round-dots" id="roundDots"></div>
    </div>
    <div class="pot" id="potBar"></div>
    <div class="cards" id="cards"></div>
    <div class="pg-tip">点击任意一张魔法牌翻开 · 翻到「奖励逃跑了」可用复活石抵消一次 · 波次越高奖励越大</div>
  </div>

  <!-- ========= 商铺页 ========= -->
  <div id="pageShop" class="hidden">
    <div class="topbar">
      <div class="title" style="font-size:20px;">🛒 魔法商铺</div>
      <button class="btn-back" onclick="backHome()">返回</button>
    </div>
    <div class="compose-bar">
      <img src="/assets/game/icon_frag.png" style="width:40px;height:40px;" alt="">
      <div class="t-info" style="flex:1;">
        <div class="t-name" style="font-size:14px;font-weight:600;">碎片合成魔法球</div>
        <div class="t-desc" style="font-size:11px;color:#c9b3e8;margin-top:2px;" id="composeDesc"></div>
      </div>
      <button class="btn" id="btnCompose" onclick="compose()">合成</button>
    </div>
    <div class="shop-list" id="shopList"></div>
  </div>
</div>

<div id="modalRoot"></div>

<script>
// ===== 鉴权（与 writer.html 同款） =====
const TOKEN = localStorage.getItem('jdy_token');
if (!TOKEN) location.href = '/login.html';
async function api(path, opt = {}) {
  opt.headers = Object.assign({}, opt.headers, { 'Authorization': 'Bearer ' + TOKEN });
  if (opt.body && typeof opt.body !== 'string') { opt.body = JSON.stringify(opt.body); opt.headers['Content-Type'] = 'application/json'; }
  const r = await fetch(path, opt);
  if (r.status === 401) { localStorage.removeItem('jdy_token'); localStorage.removeItem('jdy_user'); location.href = '/login.html'; throw new Error('未登录'); }
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || '请求失败');
  return j;
}

const CN = { frag:'碎片', key:'钥匙', ball:'魔法球', bagS:'福袋(小)', bagM:'福袋(中)', bagL:'福袋(大)', frags:'碎片', keys:'钥匙', balls:'魔法球', revives:'复活石' };
const ICO = { frag:'/assets/game/icon_frag.png', key:'/assets/game/icon_key.png', ball:'/assets/game/icon_ball.png', revive:'/assets/game/icon_revive.png', bagS:'/assets/game/bag_s.png', bagM:'/assets/game/bag_m.png', bagL:'/assets/game/bag_l.png' };
// 【2026-09-17 加固】统一 HTML 转义：商铺条目名/描述、服务器报错等拼接进 innerHTML 前先过 esc
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const WAVES = ['第一波','第二波','第三波'];

let STATE = null;   // /api/game/state 结果
let SESS = null;    // 当前对局
let FLIPPING = false; // 【2026-09-14 修复】连点锁：一次翻牌请求未落地前禁止再翻

function $(id){ return document.getElementById(id); }
function toast(msg, ms=1800){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }
function invHTML(p){ const ICON_MAP = { keys:'key', balls:'ball', frags:'frag', revives:'revive', bagS:'bagS', bagM:'bagM', bagL:'bagL' };
  return [['keys','钥匙'],['balls','魔法球'],['frags','碎片'],['revives','复活石'],['bagS','福袋·小'],['bagM','福袋·中'],['bagL','福袋·大']].map(([k,lbl]) =>
  `<div class="inv-item"><img src="${ICO[ICON_MAP[k]]}"><div class="num">${p[k]||0}</div><div class="lbl">${lbl}</div></div>`).join(''); }

async function refresh(){
  STATE = await api('/api/game/state');
  if (STATE.maintenance) {
    $('pageHome').classList.add('hidden');
    $('pageGame').classList.add('hidden');
    $('pageShop').classList.add('hidden');
    document.body.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;text-align:center;padding:20px"><div style="font-size:64px;margin-bottom:20px">🔧</div><h2>活动维护中</h2><p style="opacity:.8;margin-top:10px">活动正在升级优化，稍后再来玩吧~</p><button class="btn" style="margin-top:20px;background:#fff;color:#667eea" onclick="location.href='/writer.html?tab=game'">返回</button></div>`;
    return;
  }
  render();
}
function render(){
  $('actTime').textContent = `活动时间 ${STATE.activity.start} ~ ${STATE.activity.end}`;
  $('invBar').innerHTML = invHTML(STATE.bag);
  $('btnDaily').disabled = STATE.dailyClaimed;
  $('btnDaily').textContent = STATE.dailyClaimed ? '已领取' : '领取';
  $('btnStart').disabled = !!STATE.session;
  $('btnStart').textContent = STATE.session ? '对局进行中…' : '开始翻牌';
  $('composeDesc').textContent = `当前碎片 ${STATE.bag.frags||0} / ${STATE.activity.composeFragCost}，魔法球 ${STATE.bag.balls||0} 个`;
  $('btnCompose').disabled = (STATE.bag.frags||0) < STATE.activity.composeFragCost;
  // 【v22.0】任务专区条目来自后台配置
  const ts = STATE.tasks || [];
  $('taskBarDesc').textContent = ts.length
    ? ts.slice(0, 2).map(t => t.title).join(' · ')
    : '每日登录领钥匙 · 完成游戏赢碎片 · 邀请好友得奖励';
  renderShop();
  const s = STATE.session;
  if (s) { showGame(s); if (s.waveDone) showWaveDone(s.wave, s.pot); else if (s.pendingEscape) showEscapeModal(s); }
}
function renderShop(){
  // 【v23.1】图标支持人工指定图片地址（后台配了 URL 就直接用），否则按内置图标名取
  const icoSrc = v => /^(https?:\/\/|\/assets\/|\/games\/)/.test(v || '') ? v : (ICO[v] || ICO.ball);
  $('shopList').innerHTML = STATE.shop.map(it => {
    const src = icoSrc(it.icon);
    return it.enabled
    ? `<div class="shop-item"><img src="${src}" onerror="this.src='${ICO.ball}'"><div class="s-info"><div class="s-name">${esc(it.name)}</div><div class="s-desc">${esc(it.desc||'')}</div><div class="s-cost">魔法球 ×${it.cost}</div></div><button class="btn" onclick="buy('${it.id}')">兑换</button></div>`
    : `<div class="shop-item" style="opacity:.55;"><img src="${src}" onerror="this.src='${ICO.ball}'"><div class="s-info"><div class="s-name">${esc(it.name)}</div><div class="s-desc">${esc(it.desc||'新品整理中，敬请期待')}</div></div><button class="btn" disabled>即将上线</button></div>`;
  }).join('');
}

// ===== 弹窗 =====
function modal(html){ $('modalRoot').innerHTML = `<div class="mask"><div class="modal">${html}</div></div>`; }
function closeModal(){ $('modalRoot').innerHTML = ''; }

// ===== 每日钥匙 / 合成 / 福袋 =====
async function claimDaily(){ try{ await api('/api/game/daily',{method:'POST'}); toast('领取成功：魔法钥匙 +1'); SND.coin(); await refresh(); }catch(e){ toast(e.message); } }
async function compose(){ try{ const r = await api('/api/game/compose',{method:'POST'}); modal(`<img class="m-ico" src="/assets/game/icon_ball.png"><h3>合成成功！</h3><p>消耗碎片 ×${STATE.activity.composeFragCost}，获得魔法球 ×1</p><div class="m-btns"><button class="btn" onclick="closeModal();refresh()">好的</button></div>`); SND.coin(); }catch(e){ toast(e.message); } }
async function openBags(){
  const bags = ['bagS','bagM','bagL'].filter(k => (STATE.bag[k]||0) > 0);
  if (!bags.length) return toast('暂无可拆的福袋，去翻牌赢取吧');
  const labels = { bagS:'小福袋', bagM:'中福袋', bagL:'大福袋' };
  modal(`<h3>拆福袋</h3><p>${bags.map(k=>`${labels[k]} ×${STATE.bag[k]}`).join(' · ')}</p>
    <div class="m-btns">${bags.map(k=>`<button class="btn" onclick="doOpen('${k}')">${labels[k]}</button>`).join('')}
    <button class="btn btn-ghost" onclick="closeModal()">取消</button></div>`);
}
async function doOpen(size){
  closeModal();
  try{ const r = await api('/api/game/bag/open',{method:'POST',body:{size}});
    modal(`<img class="m-ico" src="${ICO[size]}"><h3>恭喜！</h3><div class="bag-open-txt">+${r.amount} 元</div><p>现金已存入你的钱包，可提现</p><div class="m-btns"><button class="btn" onclick="closeModal();refresh()">太棒了</button></div>`);
    SND.bag();
  }catch(e){ toast(e.message); }
}

// ===== 对局 =====
async function startGame(){
  try{
    const r = await api('/api/game/start',{method:'POST'});
    STATE.bag.keys = r.keys;
    $('invBar').innerHTML = invHTML(STATE.bag);
    showGame(r.session);
  }catch(e){ toast(e.message); }
}
function showGame(s){

// ===== 【v22.0】音效与背景音乐（Web Audio 实时合成，零素材、离线可用） =====
// 翻牌 / 奖励 / 逃跑 / 金币 / 福袋 各有专属音色；BGM 是慢速和弦循环垫乐。
// 浏览器自动播放策略：第一次用户点按页面后才创建 AudioContext 并起 BGM。
const SND = (() => {
  let ctx = null, master = null, bgmTimer = null, chord = 0;
  let enabled = localStorage.getItem('ff_snd') !== '0';
  const CHORDS = [ [261.6, 329.6, 392.0], [293.7, 349.2, 440.0], [349.2, 440.0, 523.3], [329.6, 392.0, 493.9] ];
  function ac(){
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.6; master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type, vol, when, slideTo){
    if (!enabled) return;
    try {
      const c = ac(), t0 = c.currentTime + (when || 0);
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + dur + 0.05);
    } catch (e) {}
  }
  function swish(dur, vol, freq){
    if (!enabled) return;
    try {
      const c = ac(), t0 = c.currentTime;
      const len = Math.floor(c.sampleRate * dur);
      const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = c.createBufferSource(); src.buffer = buf;
      const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 1600; f.Q.value = 0.8;
      const g = c.createGain(); g.gain.value = vol || 0.2;
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t0);
    } catch (e) {}
  }
  function pad(freqs, dur){
    if (!enabled || !ctx) return;
    try {
      const t0 = ctx.currentTime;
      freqs.forEach(f => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.linearRampToValueAtTime(0.035, t0 + 1.2);
        g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g); g.connect(master);
        o.start(t0); o.stop(t0 + dur + 0.1);
      });
    } catch (e) {}
  }
  return {
    get enabled(){ return enabled; },
    // 首次用户手势：建 AudioContext + 起 BGM（浏览器要求必须有手势才能出声）
    unlock(){ try { ac(); if (enabled) this.bgmStart(); } catch (e) {} },
    toggle(){
      enabled = !enabled; localStorage.setItem('ff_snd', enabled ? '1' : '0');
      if (enabled) { try { ac(); } catch (e) {} this.bgmStart(); } else this.bgmStop();
      return enabled;
    },
    flip(){ swish(0.16, 0.22, 1700); tone(560, 0.1, 'triangle', 0.1, 0.02, 320); },
    reward(){ [660, 880, 1174].forEach((f, i) => tone(f, 0.15, 'triangle', 0.14, i * 0.08)); },
    big(){ [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.24, 'triangle', 0.16, i * 0.1)); },
    escape(){ tone(320, 0.5, 'sawtooth', 0.12, 0, 90); tone(180, 0.6, 'sine', 0.1, 0.1, 70); },
    coin(){ [1318, 1760].forEach((f, i) => tone(f, 0.12, 'square', 0.08, i * 0.07)); },
    bag(){ [392, 523, 659, 880].forEach((f, i) => tone(f, 0.16, 'triangle', 0.13, i * 0.09)); },
    bgmStart(){
      if (bgmTimer || !enabled) return;
      try { ac(); } catch (e) { return; }
      pad(CHORDS[chord % CHORDS.length], 4.2); chord++;
      bgmTimer = setInterval(() => { pad(CHORDS[chord % CHORDS.length], 4.2); chord++; }, 4200);
    },
    bgmStop(){ if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; } },
  };
})();
function toggleSnd(){
  const on = SND.toggle();

<canvas id="fx"></canvas>
<script>
// ===== 序列帧粒子特效（运行时逐帧渲染，等效序列帧动画，零素材加载）=====
const FX = (() => {
  const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
  let W, H, parts = [], running = false;
  function size(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
  addEventListener('resize', size); size();
  function loop(){
    ctx.clearRect(0, 0, W, H);
    parts = parts.filter(p => (p.life -= p.decay) > 0);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.vy += p.g || 0;
      p.vx *= 0.985; p.vy *= 0.985;
      ctx.globalAlpha = Math.max(p.life, 0) * (p.alpha || 1);
      if (p.type === 'spark') {
        ctx.fillStyle = p.c;
        ctx.shadowColor = p.c; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, 7); ctx.fill();
        ctx.shadowBlur = 0;
      } else { // smoke
        ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1.6 - p.life), 0, 7); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    if (parts.length) requestAnimationFrame(loop); else running = false;
  }
  function kick(){ if (!running) { running = true; requestAnimationFrame(loop); } }
  function emit(n, fn){ for (let i = 0; i < n; i++) parts.push(fn(i)); kick(); }
  function center(el){ const r = el.getBoundingClientRect(); return [r.left + r.width/2, r.top + r.height/2]; }
  return {
    // 翻牌奖励：金色迸溅
    burst(el){ const [x, y] = center(el);
      emit(36, () => { const a = Math.random()*6.28, s = 2+Math.random()*5;
        return { type:'spark', x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-2, g:0.12, r:2+Math.random()*3.5,
                 life:1, decay:0.012+Math.random()*0.015, c:['#ffd76a','#ffb347','#fff3c4','#ffec80'][i()%4|0] }; }); },
    // 逃跑：紫色烟雾扩散
    poof(el){ const [x, y] = center(el);
      emit(26, () => { const a = Math.random()*6.28, s = 1+Math.random()*3;
        return { type:'smoke', x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-1.2, g:-0.02, r:8+Math.random()*14,
                 life:1, decay:0.014+Math.random()*0.01, c:'rgba(124,77,255,0.5)', alpha:0.8 }; }); },
    // 通关：全屏彩带
    confetti(){ emit(80, () => ({ type:'spark', x:Math.random()*W, y:-20-Math.random()*80,
      vx:(Math.random()-0.5)*2, vy:2+Math.random()*3, g:0.03, r:2.5+Math.random()*3,
      life:1, decay:0.006+Math.random()*0.006,
      c:['#ffd76a','#7c4dff','#4dd0e1','#ff8a80','#b9f6ca'][Math.random()*5|0] })); }
  };
})();
</script>

<script>
// ===== 【v22.0】游戏资源包下载（Cache Storage 持久化 + SW cache-first 回源） =====
// 老版本只 fetch+blob 写 HTTP 缓存，而 SW 拦截图片请求时查的是 Cache Storage——两者不通，
// 所以出现"点了下载、显示已下载，进游戏却还要重新加载"。现在直接写入 SW 读取的那份缓存，
// 并且"已下载"的判定以 Cache Storage 里真的能查到全部资源为准（不再只看 localStorage 标记）。
(function () {
  var KEY = 'fanfanle_cache_version', VER = 'v2.0-20260918';
  var CACHE = 'fanfanle-assets-v2';
  var ASSETS = [
    '/assets/game/bg_main.jpg',
    '/assets/game/card_back.png', '/assets/game/card_front.png', '/assets/game/card_escape.png',
    '/assets/game/icon_key.png', '/assets/game/icon_ball.png', '/assets/game/icon_frag.png',
    '/assets/game/icon_revive.png', '/assets/game/bag_s.png', '/assets/game/bag_m.png', '/assets/game/bag_l.png',
  ];
  function store() { return window.caches ? caches.open(CACHE) : Promise.reject(new Error('no caches')); }
  // 已下载 = 每一个资源都能在 Cache Storage 里命中（真判定，不是只看标记）
  async function allCached() {
    if (!window.caches) return false;
    try {
      var c = await store();
      for (var i = 0; i < ASSETS.length; i++) { var r = await c.match(ASSETS[i]); if (!r) return false; }
      return true;
    } catch (e) { return false; }
  }
  async function download() {
    var c = await store(), fail = 0;
    for (var i = 0; i < ASSETS.length; i++) {
      try {
        var r = await fetch(ASSETS[i], { cache: 'no-cache' });
        if (!r.ok) throw 0;
        await c.put(ASSETS[i], r.clone());   // 写入 SW 会读的那份缓存
      } catch (e) { fail++; }
    }
    return fail === 0;
  }

  (async function boot() {
    var done = false;
    try { done = localStorage.getItem(KEY) === VER && await allCached(); } catch (e) {}
    if (done) return;                       // 真的全部在缓存里：不弹窗、不下载

    var m = document.createElement('div');
    m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
    m.innerHTML = '<div style="background:linear-gradient(180deg,#2a1f4d,#1a1233);border:1px solid #ffd76a;border-radius:16px;padding:24px;max-width:320px;width:100%;text-align:center">'
      + '<div style="font-size:40px;margin-bottom:10px">🪄</div>'
      + '<h3 style="color:#ffd76a;font-size:17px;margin-bottom:10px">游戏资源包</h3>'
      + '<p style="color:#cbb8ff;font-size:12px;line-height:1.6;margin-bottom:16px">下载本游戏美术资源（约 0.6MB），<br>完成后翻牌秒开、离线也能玩、不重复耗流量。</p>'
      + '<div style="height:6px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin-bottom:6px">'
      + '<div id="ffProgress" style="height:100%;width:0%;background:linear-gradient(90deg,#7c4dff,#ffd76a);transition:width .25s"></div></div>'
      + '<div id="ffTip" style="font-size:11px;color:rgba(255,255,255,.6);margin-bottom:14px">等待开始…</div>'
      + '<button id="ffGo" style="background:linear-gradient(135deg,#7c4dff,#6c3fd6);color:#fff;border:none;border-radius:10px;padding:11px 28px;font-size:14px;font-weight:700;cursor:pointer;margin-right:8px">立即下载</button>'
      + '<button id="ffSkip" style="background:rgba(255,255,255,.1);color:#ccc;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:11px 20px;font-size:13px;cursor:pointer">暂不</button></div>';
    document.body.appendChild(m);
    function fin(ok) {
      var t = document.getElementById('ffTip');
      if (!t) return;
      if (ok) { t.textContent = '下载完成！🎉 翻牌秒开'; localStorage.setItem(KEY, VER); setTimeout(function () { m.remove(); }, 1200); }
      else t.textContent = '部分资源下载失败，游戏仍可正常玩（下次进入会自动补）';
    }
    async function run() {
      var tip = document.getElementById('ffTip'), p = document.getElementById('ffProgress');
      if (tip) tip.textContent = '正在下载游戏资源…';
      var ok = true;
      try {
        var c = await store();
        for (var i = 0; i < ASSETS.length; i++) {
          try {
            var r = await fetch(ASSETS[i], { cache: 'no-cache' });
            if (!r.ok) throw 0;
            await c.put(ASSETS[i], r.clone());
          } catch (e) { ok = false; }
          if (p) p.style.width = Math.round((i + 1) / ASSETS.length * 100) + '%';
          if (tip) tip.textContent = '下载中… ' + (i + 1) + '/' + ASSETS.length;
        }
        ok = ok && await allCached();     // 下载完再真验一遍
      } catch (e) { ok = false; }
      fin(ok);
    }
    var go = document.getElementById('ffGo');
    if (go) go.onclick = function () { this.style.display = 'none'; var s = document.getElementById('ffSkip'); if (s) s.style.display = 'none'; run(); };
    // 【保留】进入游戏自动开始下载（可切后台）；"暂不"也只延后到下次进入
    if (go) go.click();
  })();
})();
</script>
</body>
</html>
