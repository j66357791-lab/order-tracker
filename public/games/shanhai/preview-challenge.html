<!DOCTYPE html>
<!-- 【预览页】挑战模式 · 灵脉争夺战 壳子预览（无需登录）。
     正式入口：游戏内选关页「挑战模式」横条海报。此页仅用于查看与调整，不参与玩法数据。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>预览 · 灵脉争夺战壳子</title>
<link rel="stylesheet" href="css/style.css?v=36">
<style>
  body { padding: 0 0 40px; overflow: auto; display: block; }
  .pv-note { max-width: 540px; margin: 0 auto; padding: 10px 14px; font: 12px/1.7 "PingFang SC", sans-serif; color: #cfe8d8; background: rgba(212,184,122,.12); border-bottom: 1px solid rgba(212,184,122,.3); }
  .pv-note b { color: #ffd76a; }
  .pv-open { max-width: 540px; margin: 14px auto; text-align: center; }
</style>
</head>
<body>
  <div class="pv-note">📌 <b>预览页</b>：挑战模式「灵脉争夺战」壳子。正式版在游戏内选关页的横条海报进入；本页免登录，用于确认布局/美术/交互。</div>
  <div class="pv-open"><button class="dd-btn" style="width:auto;padding:10px 26px" onclick="showChallenge()">打开灵脉争夺战</button></div>
  <div class="pv-open" style="font:11px/1.7 sans-serif;color:#8fae9e">说明：地图 1800×1300，随机分布 Lv1×6 / Lv2×5 / Lv3×4 / Lv4×2 / Lv5×1 灵脉；点击灵脉看详情；守护者建模与战斗后续接入。</div>
<script>
"use strict";
/* ===== 以下与正式版 index.html 中的挑战模式代码保持一致 ===== */
const CHAL = { W: 1800, H: 1300, LV_COLOR: { 1: '#6fd8a0', 2: '#54b4e8', 3: '#b48af0', 4: '#f0b454', 5: '#f0546e' }, OUTPUT: { 1: '10', 2: '25', 3: '60', 4: '150', 5: '400' } };

function genVeins() {
  const LV = [[1, 6], [2, 5], [3, 4], [4, 2], [5, 1]];
  const pts = [];
  for (const [lv, cnt] of LV) {
    let placed = 0, guard = 0;
    while (placed < cnt && guard++ < 600) {
      const x = 130 + Math.random() * (CHAL.W - 260);
      const y = 110 + Math.random() * (CHAL.H - 240);
      if (pts.every(p => Math.hypot(p.x - x, p.y - y) > 210)) { pts.push({ x: Math.round(x), y: Math.round(y), lv }); placed++; }
    }
  }
  return pts;
}

function veinSvg(lv, size) {
  const c = CHAL.LV_COLOR[lv];
  return `<svg viewBox="0 0 60 72" style="width:${size}px;height:${size * 1.2}px;display:block">
    <ellipse cx="30" cy="64" rx="${10 + lv * 2}" ry="4" fill="rgba(0,0,0,.35)"/>
    <polygon points="30,4 ${20 + lv},30 30,60 ${40 - lv},30" fill="${c}" opacity=".92"/>
    <polygon points="30,4 30,60 ${40 - lv},30" fill="rgba(0,0,0,.22)"/>
    <polygon points="30,4 ${20 + lv},30 30,60" fill="rgba(255,255,255,.28)"/>
    <text x="30" y="70" text-anchor="middle" font-size="9" font-weight="700" fill="${c}">Lv.${lv}</text>
  </svg>`;
}

function closeChallenge() {
  const m = document.getElementById("chalMask");
  if (m) m.remove();
}

function showChallenge() {
  closeChallenge();
  const mask = document.createElement("div");
  mask.className = "ex-mask"; mask.id = "chalMask";
  mask.onclick = e => { if (e.target === mask) closeChallenge(); };
  const nodes = genVeins();
  mask.innerHTML = `
    <div class="ex-wrap" style="max-width:540px;width:96vw;height:88vh">
      <div class="ex-head" style="padding-top:11px">
        <div class="ex-sub">挑战模式 · 灵脉争夺战</div>
        <div class="ex-close" id="chalClose">×</div>
      </div>
      <div class="chal-viewport" id="chalViewport">
        <div class="chal-map" id="chalMap">
          <div class="chal-map-bg"></div>
          ${nodes.map((p, i) => `
            <div class="chal-node" data-i="${i}" style="left:${p.x}px;top:${p.y}px">
              ${veinSvg(p.lv, 44 + p.lv * 9)}
            </div>`).join("")}
        </div>
        <div class="chal-zoombar">
          <button data-z="in">＋</button><button data-z="out">－</button><button data-z="reset">⟲</button>
          <i>拖动查看地图 · 点击灵脉查看详情</i>
        </div>
      </div>
      <div class="chal-detail" id="chalDetail"><div class="act-empty">点击地图上的灵脉查看详情</div></div>
    </div>`;
  document.body.appendChild(mask);
  document.getElementById("chalClose").onclick = closeChallenge;
  const vp = document.getElementById("chalViewport");
  const map = document.getElementById("chalMap");
  let scale = 1, tx = 0, ty = 0, drag = null, pinch0 = 0, scale0 = 1, tDrag = null;
  const apply = () => { map.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; };
  // 初始视野居中
  requestAnimationFrame(() => {
    const r0 = vp.getBoundingClientRect();
    tx = (r0.width - CHAL.W * scale) / 2; ty = (r0.height - CHAL.H * scale) / 2; apply();
  });
  const zoomAt = ns => {
    ns = Math.max(0.55, Math.min(2, ns));
    const k = ns / scale, r = vp.getBoundingClientRect();
    const cx = r.width / 2, cy = r.height / 2;
    tx = cx - (cx - tx) * k; ty = cy - (cy - ty) * k; scale = ns; apply();
  };
  vp.addEventListener("wheel", e => { e.preventDefault(); zoomAt(scale * (e.deltaY < 0 ? 1.12 : 0.9)); }, { passive: false });
  vp.addEventListener("pointerdown", e => { if (e.target.closest('.chal-node')) return; drag = { x: e.clientX, y: e.clientY, tx, ty }; });
  vp.addEventListener("pointermove", e => {
    if (!drag) return;
    tx = drag.tx + (e.clientX - drag.x); ty = drag.ty + (e.clientY - drag.y); apply();
  });
  vp.addEventListener("pointerup", () => { drag = null; });
  vp.addEventListener("pointercancel", () => { drag = null; });
  // 【v26.45】单指拖动原生 touch 兜底
  vp.addEventListener("touchstart", e => {
    if (e.touches.length >= 2) {
      pinch0 = 0; tDrag = null;
    } else if (e.touches.length === 1) {
      tDrag = { x: e.touches[0].clientX, y: e.touches[0].clientY, tx, ty };
    }
  }, { passive: true });
  vp.addEventListener("touchmove", e => {
    if (e.touches.length >= 2) {
      e.preventDefault();
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      if (!(pinch0 > 0)) { pinch0 = d; scale0 = scale; return; }
      zoomAt(scale0 * d / pinch0);
      return;
    }
    if (tDrag && e.touches.length === 1) {
      e.preventDefault();
      const t = e.touches[0];
      tx = tDrag.tx + (t.clientX - tDrag.x); ty = tDrag.ty + (t.clientY - tDrag.y);
      apply();
    }
  }, { passive: false });
  vp.addEventListener("touchend", e => {
    if (e.touches.length < 2) pinch0 = 0;
    if (e.touches.length === 1) { tDrag = { x: e.touches[0].clientX, y: e.touches[0].clientY, tx, ty }; }
    else tDrag = null;
  });
  // 【v26.47】document 级兜底
  document.addEventListener("touchmove", e => {
    if ((!drag && !tDrag) || !e.target.closest) return;
    if (e.target.closest('.chal-viewport')) e.preventDefault();
  }, { passive: false });
  vp.addEventListener("touchend", () => { pinch0 = 0; });
  vp.querySelectorAll(".chal-zoombar button").forEach(b => b.onclick = () => {
    if (b.dataset.z === "in") zoomAt(scale * 1.2);
    else if (b.dataset.z === "out") zoomAt(scale * 0.83);
    else { scale = 1; tx = 0; ty = 0; apply(); }
  });
  mask.querySelectorAll(".chal-node").forEach(nd => nd.onclick = () => {
    const p = nodes[+nd.dataset.i];
    const det = document.getElementById("chalDetail");
    det.innerHTML = `
      <div class="chal-d-head">${veinSvg(p.lv, 34)}<div><b>Lv.${p.lv} 灵脉</b><i>产出 ${CHAL.OUTPUT[p.lv]} 灵气/小时（占领后）</i></div>
        <span class="chal-lv c${p.lv}">Lv.${p.lv}</span></div>
      <div class="chal-d-row">需要击败 <b>Lv.${p.lv} 灵脉守护者</b> 后占领；占领期间持续产出灵气。</div>
      <div class="chal-d-row">守护者形象与战斗玩法开发中，敬请期待。</div>
      <button class="dd-btn" disabled>挑战守护者（即将开放）</button>`;
  });
}
showChallenge();
</script>
</body>
</html>
