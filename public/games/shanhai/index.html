<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>山海斩妖录</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ① 封面 -->
  <div class="screen on" id="scrCover">
    <div class="cover-bg"></div>
    <div class="cover-vignette"></div>
    <div class="cover-body">
      <div class="logo-vert">
        <span class="logo-ch">山</span><span class="logo-ch">海</span>
        <span class="logo-ch accent">斩</span><span class="logo-ch accent">妖</span>
        <span class="logo-ch">录</span>
      </div>
      <div class="cover-sub">S H A N H A I · 割 草 证 道</div>
    </div>
    <!-- 加载进度条（叠加在封面上） -->
    <div id="loadBar" style="position:absolute;bottom:120px;left:50%;transform:translateX(-50%);width:70%;text-align:center">
      <div style="font-size:13px;color:#ffd76a;margin-bottom:8px;letter-spacing:2px" id="loadTip">山河入梦…</div>
      <div style="height:4px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden">
        <div id="loadFill" style="height:100%;width:0%;background:linear-gradient(90deg,#ffd76a,#ff9a3c);transition:width .3s;border-radius:99px"></div>
      </div>
      <div style="font-size:12px;color:rgba(255,255,255,.7);margin-top:6px" id="loadPct">0%</div>
    </div>
    <div class="cover-foot">
      <div class="tap-hint" id="tapEnter" style="display:none">— 轻触进入 —</div>
      <div class="cover-ver">V1.5 · 御火行者</div>
    </div>
  </div>

  <!-- 加载进度条已移到封面页上 -->

  <!-- ③ 主页 -->
  <div class="screen" id="scrHome">
    <div class="home-bg"></div>
    <div class="fireflies"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

    <!-- 顶栏 -->
    <div class="topbar">
      <div class="tb-user" onclick="showUserMenu()" style="cursor:pointer">
        <div class="avatar" id="avChar">御</div>
        <div class="tb-info">
          <b id="tbName">御火行者</b>
          <span id="tbTitle">初入山海</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="tb-rank" onclick="showBoard()" style="width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.3);border:1px solid rgba(212,184,122,.5);display:flex;align-items:center;justify-content:center;cursor:pointer" title="排行榜">🏆</div>
        <div class="tb-currency"><span class="yd-ico">◉</span><b id="tbYadan">0</b></div>
      </div>
    </div>

    <!-- 面板区 -->
    <div class="home-body">

      <!-- 出战 -->
      <div class="home-tab on" id="tabFight">
        <div class="stage-visual">
          <div class="stage-title-bar">
            <img src="/games/shanhai/assets/stage-title-bar.png" alt="">
            <span id="stageName">南山草泽</span>
          </div>
          <div class="stage-main">
            <div class="stage-arrow left" id="stagePrev">‹</div>
            <img src="/games/shanhai/assets/bonsai-clean.png" class="stage-img" alt="">
            <div class="stage-arrow right" id="stageNext">›</div>
          </div>
          <div class="stage-level-badge" id="stageLevel">第 一 关</div>
          <div class="stage-stars" id="stageStars">
            <img src="/games/shanhai/assets/star-gold.png" alt="">
            <img src="/games/shanhai/assets/star-gold.png" alt="">
            <img src="/games/shanhai/assets/star-gold.png" alt="">
          </div>
          <div class="stage-sub" id="stageSub">15 波 · 山臊王</div>
        </div>
        <div class="stage-actions">
          <button class="btn-stage-big" id="btnEnterBattle">出 战</button>
        </div>
        <div class="daily-tip">每局皆得妖丹 · 首通另有重赏</div>
      </div>

      <!-- 养成 -->
      <div class="home-tab" id="tabGrow">
        <div class="grow-yadan"><span class="yd-ico big">◉</span>妖丹余额 <b id="growYadan">0</b></div>
        <div class="grow-sec">◆ 技能强化（战斗内永久生效）</div>
        <div id="skillList" class="skill-list"></div>
        <div class="grow-sec">◆ 装备宝箱（<b>200</b> 妖丹一抽 · 品质不足自动折算）</div>
        <div class="equip-slots">
          <div class="equip-slot" id="slotWeapon"><i>武器</i><b id="eqWeapon">空</b></div>
          <div class="equip-slot" id="slotTalisman"><i>护符</i><b id="eqTalisman">空</b></div>
        </div>
        <button class="btn-jade" id="btnDraw">开 启 宝 箱 · 200 ◉</button>
        <div class="draw-result" id="drawResult"></div>
      </div>

      <!-- 榜单 -->
      <div class="home-tab" id="tabBoard">
        <div id="shBoard" class="board-list"></div>
      </div>

      <!-- 商城（占位） -->
      <div class="home-tab" id="tabShop">
        <div class="empty-tip" style="padding:60px 0">商城敬请期待…</div>
      </div>
      <!-- 山海录（占位） -->
      <div class="home-tab" id="tabShanhai">
        <div class="empty-tip" style="padding:60px 0">山海录敬请期待…</div>
      </div>
      <!-- 挑战（占位） -->
      <div class="home-tab" id="tabChallenge">
        <div class="empty-tip" style="padding:60px 0">挑战模式敬请期待…</div>
      </div>
    </div>

    <!-- 底部导航（5个，中间战斗高亮） -->
    <nav class="home-nav nav-ink">
      <div class="hn-item" data-tab="tabShop"><i>🏪</i>商 城</div>
      <div class="hn-item" data-tab="tabGrow"><i>🛡</i>装 备</div>
      <div class="hn-item center on" data-tab="tabFight"><i>⚔</i>战 斗</div>
      <div class="hn-item" data-tab="tabShanhai"><i>📜</i>山海录</div>
      <div class="hn-item" data-tab="tabChallenge"><i>🏆</i>挑 战</div>
    </nav>
  </div>

  <!-- ④ 战斗 -->
  <div class="screen" id="scrBattle">
    <button class="btn-back-sh" id="btnQuitBattle">‹ 退出</button>
    <canvas id="game"></canvas>
    <div id="joystick"><div id="joyKnob"></div></div>
    <div id="hud" style="display:none">
      <div class="hud-top">
        <div class="hp-wrap"><div class="bar hp"><div id="hpFill"></div></div><span id="hpText">100/100</span></div>
        <div class="exp-wrap"><div class="bar exp"><div id="expFill"></div></div><span id="lvText">Lv.1</span></div>
        <div class="stats"><span id="waveText">波次 1/15</span><span id="timeText">00:00</span><span id="killText">斩妖 0</span></div>
      </div>
      <div id="bossBar"><span id="bossName">山臊王</span><div class="bar boss"><div id="bossFill"></div></div></div>
      <div id="skillBar"></div>
      <div id="banner" style="display:none"><b id="bannerMain"></b><span id="bannerSub"></span></div>
    </div>
  </div>

  <!-- 弹层 -->
  <div id="overlay"></div>
</div>

<script src="js/config.js"></script>
<script>
"use strict";
// ===== 后端对接层 =====
const SH_TOKEN = localStorage.getItem("jdy_token");
if (!SH_TOKEN) location.href = "/login.html";
async function shApi(path, opt = {}) {
  const r = await fetch(path, { ...opt, headers: { "Content-Type": "application/json", Authorization: "Bearer " + SH_TOKEN, ...(opt.headers || {}) } });
  if (r.status === 401) { localStorage.removeItem("jdy_token"); localStorage.removeItem("jdy_user"); location.href = "/login.html"; throw new Error("未登录"); }
  return r.json();
}
function fmtT(s) { s = Math.round(s); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
</script>
<script src="js/assets.js"></script>
<script src="js/pool.js"></script>
<script src="js/meta.js"></script>
<script src="js/entities.js"></script>
<script src="js/weapons.js"></script>
<script src="js/effects.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script>
"use strict";
(async () => {
  /* ============ 屏幕编排 ============ */
  const $ = id => document.getElementById(id);
  const showScreen = id => document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));

  // —— 自动加载资源（进度条在封面上）——
  Assets.load("assets/sprites", (done, total, name) => {
    const pct = Math.round(done / total * 100);
    $("loadPct").textContent = pct + "%";
    $("loadFill").style.width = pct + "%";
    const tips = ["山河入梦…", "异兽蠢蠢欲动…", "御火者披挂上阵…", "妖丹淬炼中…"];
    $("loadTip").textContent = tips[Math.floor(done / total * tips.length)] || tips[0];
  }).then(async () => {
    await META.load();
    renderHome();
    // 加载完，隐藏进度条，显示轻触进入
    $("loadBar").style.display = "none";
    $("tapEnter").style.display = "block";
  }).catch(e => { $("loadTip").textContent = "加载失败，请刷新重试"; console.error(e); });

  // 点封面进入主页
  $("scrCover").addEventListener("click", () => {
    showScreen("scrHome");
  }, { once: true });

  // 用户菜单弹窗
  function showUserMenu() {
    const html = `
      <div id="userMenuMask" style="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;display:flex;align-items:center;justify-content:center" onclick="this.remove()">
        <div style="background:linear-gradient(180deg,#f5f0e0,#e8dcc8);border-radius:16px;padding:20px;width:280px;text-align:center" onclick="event.stopPropagation()">
          <div style="font-size:18px;font-weight:900;color:#3a5a4a;margin-bottom:16px">设置</div>
          <div style="display:flex;flex-direction:column;gap:10px">
            <div style="padding:12px;background:#fff;border-radius:10px;cursor:pointer" onclick="this.parentElement.parentElement.parentElement.remove();alert('音效功能开发中')">🔊 音效设置</div>
            <div style="padding:12px;background:#fff;border-radius:10px;cursor:pointer" onclick="location.href='/writer.html?tab=game'">🏠 返回网站</div>
            <div style="padding:12px;background:#fff;border-radius:10px;cursor:pointer;color:#c0392b" onclick="localStorage.removeItem('jdy_token');localStorage.removeItem('jdy_user');location.href='/login.html'">🚪 退出登录</div>
          </div>
        </div>
      </div>`;
    document.body.insertAdjacentHTML('beforeend', html);
  }
  window.showUserMenu = showUserMenu;

  // 显示排行榜
  function showBoard() {
    document.querySelectorAll('.hn-item').forEach(x => x.classList.remove('on'));
    document.querySelectorAll('.home-tab').forEach(x => x.classList.remove('on'));
    document.querySelector('[data-tab="tabChallenge"]').classList.add('on');
    document.getElementById('tabChallenge').classList.add('on');
    // 加载榜单到挑战tab
    if (typeof loadBoard === 'function') loadBoard();
  }
  window.showBoard = showBoard;

  // —— 主页渲染 ——
  const STAGES = [
    { id: 1, name: "南山草泽", sub: "15 波 · 山臊王", open: true },
    { id: 2, name: "雪域寒潭", sub: "冰封之地 · 敬请期待", open: false },
    { id: 3, name: "炎火山径", sub: "地火翻涌 · 敬请期待", open: false },
  ];
  function renderHome() {
    const p = META.profile || {};
    $("tbYadan").textContent = p.yadan || 0;
    $("growYadan").textContent = p.yadan || 0;
    $("tbName").textContent = p.username || "御火行者";
    const wins = p.wins || 0;
    $("tbTitle").textContent = wins >= 10 ? "山海伏妖师" : wins >= 3 ? "斩妖剑客" : wins >= 1 ? "初露锋芒" : "初入山海";
    // 关卡展示（单关卡+左右切换）
    let curStageIdx = 0;
    function renderStage(i) {
      curStageIdx = i;
      const s = STAGES[i];
      const stars = (p.stageStars || {})[s.id] || 0;
      $("stageName").textContent = s.name;
      $("stageSub").textContent = s.sub;
      $("stageStars").textContent = "★".repeat(stars) + "☆".repeat(3 - stars);
      // 左右箭头显示
      document.getElementById("stagePrev").style.opacity = i > 0 ? "1" : ".3";
      document.getElementById("stageNext").style.opacity = i < STAGES.length - 1 ? "1" : ".3";
      // 出战按钮状态
      const btn = document.getElementById("btnEnterBattle");
      if (s.open) {
        btn.disabled = false;
        btn.textContent = "出 战";
      } else {
        btn.disabled = true;
        btn.textContent = "未解锁";
      }
    }
    renderStage(0);
    document.getElementById("stagePrev").onclick = () => { if (curStageIdx > 0) renderStage(curStageIdx - 1); };
    document.getElementById("stageNext").onclick = () => { if (curStageIdx < STAGES.length - 1) renderStage(curStageIdx + 1); };
    document.getElementById("btnEnterBattle").onclick = () => {
      if (STAGES[curStageIdx].open) enterBattle(STAGES[curStageIdx].id);
    };
    // 养成
    renderGrow();
  }
  function renderGrow() {
    const p = META.profile || {};
    const B = META.bonus();
    const SK = [
      { key: "fireline", name: "凤凰火线", desc: lv => `火羽伤害 +${lv * 6}% · 弹体增大` },
      { key: "icepick", name: "寒冰锥", desc: lv => `冰锥伤害 +${lv * 6}%${lv >= 3 ? " · +1 枚" : ""}` },
      { key: "body", name: "修身体质", desc: lv => `生命上限 +${lv * 8}%` },
    ];
    $("skillList").innerHTML = SK.map(s => {
      const lv = (p.skillLv || {})[s.key] || 0;
      const max = lv >= 5;
      const cost = 100 * (lv + 1);
      return `<div class="skill-row">
        <div class="sk-lv">${lv}<small>层</small></div>
        <div class="sk-mid"><b>${s.name}</b><span>${s.desc(lv)}</span></div>
        <button class="btn-up" data-key="${s.key}" ${max || (p.yadan || 0) < cost ? "disabled" : ""}>${max ? "满层" : cost + " ◉"}</button>
      </div>`;
    }).join("");
    document.querySelectorAll(".btn-up").forEach(b => b.onclick = async () => {
      b.disabled = true;
      try { await META.upgradeSkill(b.dataset.key); renderHome(); toast("强化成功！"); }
      catch (e) { b.disabled = false; toast(e.error || "强化失败"); }
    });
    const QN = ["白", "绿", "蓝", "紫"];
    const eq = p.equip || {};
    $("eqWeapon").innerHTML = eq.weapon ? `<span class="q q${eq.weapon.q}">${QN[eq.weapon.q]}</span> 攻击 +${eq.weapon.val}%` : "空";
    $("eqTalisman").innerHTML = eq.talisman ? `<span class="q q${eq.talisman.q}">${QN[eq.talisman.q]}</span> 生命 +${eq.talisman.val}%` : "空";
  }
  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast"; t.textContent = msg;
    document.getElementById("app").appendChild(t);
    setTimeout(() => t.remove(), 1800);
  }

  // —— 抽装备箱 ——
  $("btnDraw").onclick = async () => {
    $("btnDraw").disabled = true;
    try {
      const d = await META.draw();
      renderHome();
      const g = d.got;
      const QN = ["白", "绿", "蓝", "紫"];
      $("drawResult").innerHTML = `<div class="draw-pop q-pop${g.q}">
        抽得 <b class="q q${g.q}">${QN[g.q]}·${g.slot === "weapon" ? "武器" : "护符"}</b>
        ${g.slot === "weapon" ? "攻击" : "生命"} +${g.val}%
        <small>${g.equipped ? "已自动穿戴" : "品质不及现有 · 折算 " + g.salvaged + " 妖丹"}</small></div>`;
    } catch (e) { toast(e.error || "抽取失败"); }
    $("btnDraw").disabled = false;
  };

  // —— 主页 tab 切换 ——
  document.querySelectorAll(".hn-item").forEach(n => n.onclick = async () => {
    document.querySelectorAll(".hn-item").forEach(x => x.classList.remove("on"));
    document.querySelectorAll(".home-tab").forEach(x => x.classList.remove("on"));
    n.classList.add("on");
    $("" + n.dataset.tab).classList.add("on");
    if (n.dataset.tab === "tabBoard") loadBoard();
    if (n.dataset.tab === "tabGrow") renderGrow();
  });

  // —— 榜单 ——
  window.__boardKind = "t";
  async function loadBoard() {
    const box = $("shBoard");
    box.innerHTML = '<div class="empty-tip">榜单飞驰而来…</div>';
    try {
      const d = await shApi("/api/shanhai/leaderboard");
      const kind = window.__boardKind;
      const list = kind === "t" ? d.timeBoard : d.killBoard;
      const fmt = list.map((p, i) => `<tr><td>${i + 1}</td><td>${p.username || "侠士"}</td><td>${kind === "t" ? fmtT(p.bestTimeSec) : p.bestKills}</td><td style="color:#6A7480">胜${p.wins || 0}</td></tr>`).join("") || '<tr><td colspan="4" class="empty-tip">虚位以待</td></tr>';
      box.innerHTML = `<div class="board-tabs">
        <button class="${kind === "t" ? "on" : ""}" data-k="t">最快通关</button>
        <button class="${kind === "k" ? "on" : ""}" data-k="k">斩妖最多</button>
      </div><table><tr><th>#</th><th>侠士</th><th>${kind === "t" ? "用时" : "斩妖"}</th><th>战绩</th></tr>${fmt}</table>`;
      box.querySelectorAll(".board-tabs button").forEach(b => b.onclick = () => { window.__boardKind = b.dataset.k; loadBoard(); });
    } catch (e) { box.innerHTML = '<div class="empty-tip">加载失败</div>'; }
  }

  /* ============ 战斗 ============ */
  let curStage = 1;
  function enterBattle(stage) {
    curStage = stage;
    showScreen("scrBattle");
    window.dispatchEvent(new Event("resize"));
    Game.startRun(stage);
  }
  function backHome() {
    Game.state !== undefined && (Game.pause());
    $("overlay").style.display = "none";
    showScreen("scrHome");
    META.load().then(renderHome);
  }
  $("btnQuitBattle").onclick = backHome;
  $("btnLogout").onclick = () => { localStorage.removeItem("jdy_token"); localStorage.removeItem("jdy_user"); location.href = "/login.html"; };

  // 结算 monkey-patch：上报 + 返回主页按钮
  const _over = UI.gameOver, _win = UI.victory;
  UI.gameOver = function (stats, hero) { META.report(false, curStage).then(g => g && renderHome()); const r = _over(stats, hero); addHomeBtn(); return r; };
  UI.victory = function (stats, hero) {
    META.report(true, curStage).then(g => {
      renderHome();
      if (g) {
        const p = document.querySelector(".panel .result-grid");
        if (p) p.insertAdjacentHTML("afterend", `<div class="gain-line">◉ 妖丹 +${g.yadan}${g.firstClear ? " · 首通重赏已入袋" : ""} · 评级 ${"★".repeat(g.stars)}${"☆".repeat(3 - g.stars)}</div>`);
      }
    });
    const r = _win(stats, hero); addHomeBtn(); return r;
  };
  function addHomeBtn() {
    setTimeout(() => {
      const p = document.querySelector(".panel");
      if (p && !document.getElementById("btnHome")) {
        p.querySelector(".btn").insertAdjacentHTML("afterend", '<button class="btn btn-sub" id="btnHome">返回主页</button>');
        $("btnHome").onclick = backHome;
      }
    }, 30);
  }

  Game.start();   // 预热画布（等 enterBattle 才 startRun）
})();
</script>
</body>
</html>
