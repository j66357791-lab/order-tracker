<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
<title>登录 · 订单派单系统</title>
<style>
  :root{ --blue:#3b82f6; --green:#07c160; --ink:#0f172a; --sub:#64748b; --line:#e2e8f0; --red:#dc2626; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);font-size:14px;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
       background:linear-gradient(135deg,#667eea 0%,#3b82f6 50%,#06b6d4 100%);position:relative;overflow:hidden}
  body::before,body::after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
  body::before{width:420px;height:420px;top:-120px;right:-100px}
  body::after{width:300px;height:300px;bottom:-80px;left:-60px}
  .card{background:#fff;border-radius:20px;padding:32px 28px;width:100%;max-width:380px;
        box-shadow:0 20px 60px rgba(0,0,0,.25);position:relative;z-index:1}
  .logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,#6ee7b7,#07c160);
        display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px;
        box-shadow:0 6px 16px rgba(7,193,96,.35)}
  h1{font-size:19px;text-align:center;margin-bottom:4px}
  .sub{font-size:12px;color:var(--sub);margin-bottom:22px;text-align:center}
  .tabs{display:flex;gap:6px;background:#f1f5f9;border-radius:10px;padding:4px;margin-bottom:18px}
  .tabs button{flex:1;padding:8px;border:none;background:transparent;border-radius:8px;cursor:pointer;font-size:13px;color:var(--sub);transition:all .15s}
  .tabs button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
  input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;outline:none;transition:border .15s,box-shadow .15s}
  input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(7,193,96,.12)}
  button.primary{width:100%;margin-top:20px;padding:11px;background:linear-gradient(135deg,#07c160,#059a4e);color:#fff;border:none;border-radius:10px;font-size:14px;cursor:pointer;font-weight:600;transition:filter .15s;box-shadow:0 4px 12px rgba(7,193,96,.3)}
  button.primary:hover{filter:brightness(1.06)}
  button.primary:active{transform:scale(.98)}
  .err{color:var(--red);font-size:12px;margin-top:10px;min-height:16px;text-align:center}
  .hidden{display:none}

  /* ===== 移动端App体验优化 ===== */
  html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}
  body{position:fixed;inset:0;width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
  @supports(padding:max(0px)){
    .safe-top{padding-top:max(0px,env(safe-area-inset-top))}
    .safe-bottom{padding-bottom:max(0px,env(safe-area-inset-bottom))}
  }

</style>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#07c160">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>
<div class="card">
  <div class="logo">📨</div>
  <h1>订单派单系统</h1>
  <div class="sub" id="subTip">管理员与写手登录入口</div>

  <div id="setupBox" class="hidden">
    <div class="sub" style="color:var(--green)">首次使用：请先创建管理员账号（仅此一次）</div>
    <label>显示名（如：老板）</label><input id="sName" placeholder="老板">
    <label>登录用户名（字母数字，3-20位）</label><input id="sUser" placeholder="boss">
    <label>密码（至少6位）</label><input id="sPass" type="password" placeholder="••••••">
    <button class="primary" id="btnSetup">创建管理员账号</button>
    <div class="err" id="setupErr"></div>
  </div>

  <div id="mainBox" class="hidden">
    <div class="tabs">
      <button id="tabLogin" class="on">登 录</button>
      <button id="tabReg">写手注册</button>
    </div>

    <div id="loginForm">
      <label>用户名</label><input id="lUser">
      <label>密码</label><input id="lPass" type="password">
      <button class="primary" id="btnLogin">登 录</button>
    </div>

    <div id="regForm" class="hidden">
      <label>邀请码（找管理员要）</label><input id="rInvite" placeholder="WXXXXXXXX">
      <label>显示名（如：小王）</label><input id="rName">
      <label>用户名（字母数字，3-20位）</label><input id="rUser">
      <label>密码（至少6位）</label><input id="rPass" type="password">
      <label>邮箱（选填，离线通知用）</label><input id="rEmail" type="email">
      <label>人机验证</label>
      <div style="display:flex;gap:8px;align-items:center">
        <div id="capBox" style="flex-shrink:0;cursor:pointer" title="看不清？点一下换一个" onclick="loadCaptcha()"></div>
        <input id="rCap" placeholder="计算结果" inputmode="numeric" maxlength="4" style="flex:1">
      </div>
      <label style="display:flex;align-items:flex-start;gap:8px;font-size:12px;color:#475569;cursor:pointer;line-height:1.5;margin-top:4px">
        <input type="checkbox" id="rAgree" style="margin-top:2px;width:auto">
        <span>我已阅读并同意<a href="javascript:void(0)" id="ctLink" style="color:#059669;font-weight:600">《兼职写手合作签约协议》</a>，注册即完成电子签署</span>
      </label>
      <button class="primary" id="btnReg">注册并登录</button>
    </div>
    <div class="err" id="mainErr"></div>
  </div>
</div>

<div id="ctMask" style="position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:99;display:none;align-items:center;justify-content:center;padding:16px">
  <div style="background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:86vh;display:flex;flex-direction:column;padding:18px">
    <h3 style="font-size:16px;text-align:center;margin:0 0 4px">📜 兼职写手合作签约协议</h3>
    <div style="font-size:11px;color:#94a3b8;text-align:center;margin-bottom:10px">版本 V1.0</div>
    <div id="ctText" style="flex:1;overflow-y:auto;background:#f8fafc;border-radius:10px;padding:14px;font-size:13px;line-height:1.8;white-space:pre-wrap;min-height:200px">加载中…</div>
    <button class="primary" id="ctClose" style="margin-top:12px">我已阅读</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const err = m => { $('mainErr').textContent = m || ''; };
// 密码传输加密：SHA-256 预哈希后再发（旧账号首次登录带原文用于静默升级）
async function sha256hex(s) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(s)));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
let captchaId = '';
async function loadCaptcha() {
  try {
    const j = await fetch('/api/captcha').then(x => x.json());
    captchaId = j.id;
    $('capBox').innerHTML = j.svg;
  } catch (e) { $('capBox').innerHTML = '<div style="font-size:11px;color:#94a3b8;padding:18px 10px">验证码加载失败</div>'; }
}
loadCaptcha();

(async () => {
  const r = await fetch('/api/setup/state');
  const j = await r.json();
  if (j.needsSetup) { $('setupBox').classList.remove('hidden'); $('subTip').textContent = '检测到系统未初始化'; }
  else $('mainBox').classList.remove('hidden');
  if (localStorage.getItem('jdy_token')) {
    try {
      const me = await fetch('/api/me', { headers: { Authorization: 'Bearer ' + localStorage.getItem('jdy_token') } }).then(x => x.json());
      if (me.ok) location.href = me.user.role === 'admin' ? '/index.html' : '/writer.html';
    } catch (e) {}
  }
})();

$('tabLogin').onclick = () => {
  $('tabLogin').classList.add('on'); $('tabReg').classList.remove('on');
  $('loginForm').classList.remove('hidden'); $('regForm').classList.add('hidden'); err('');
};
$('tabReg').onclick = () => {
  $('tabReg').classList.add('on'); $('tabLogin').classList.remove('on');
  $('regForm').classList.remove('hidden'); $('loginForm').classList.add('hidden'); err('');
};
$('ctLink').onclick = async () => {
  try {
    const j = await fetch('/api/contract/text').then(x => x.json());
    $('ctText').textContent = j.text || '加载失败';
  } catch (e) { $('ctText').textContent = '加载失败，请稍后重试'; }
  $('ctMask').style.display = 'flex';
};
$('ctClose').onclick = () => { $('ctMask').style.display = 'none'; $('rAgree').checked = true; };
function enter(role, token, user) {
  localStorage.setItem('jdy_token', token);
  localStorage.setItem('jdy_user', JSON.stringify(user));
  location.href = role === 'admin' ? '/index.html' : '/writer.html';
}
$('btnSetup').onclick = async () => {
  $('setupErr').textContent = '';
  try {
    const r = await fetch('/api/setup', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('sUser').value.trim(), password: $('sPass').value, displayName: $('sName').value.trim() }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    enter('admin', j.token, j.user);
  } catch (e) { $('setupErr').textContent = e.message; }
};
$('btnLogin').onclick = async () => {
  err('');
  try {
    const plain = $('lPass').value;
    const body = { username: $('lUser').value.trim(), password: await sha256hex(plain) };
    // 兼容旧账号静默升级：仅在密码哈希不匹配时服务端才会用到原文
    body.passwordPlain = plain;
    const r = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    enter(j.user.role, j.token, j.user);
  } catch (e) { err(e.message); }
};
$('btnReg').onclick = async () => {
  err('');
  if (!$('rAgree').checked) { err('请先阅读并勾选同意《兼职写手合作签约协议》'); return; }
  if (!$('rCap').value.trim()) { err('请输入人机验证结果'); return; }
  try {
    const r = await fetch('/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ inviteCode: $('rInvite').value.trim(), username: $('rUser').value.trim(),
        password: await sha256hex($('rPass').value), displayName: $('rName').value.trim(), email: $('rEmail').value.trim(), agree: true,
        captchaId, captchaAnswer: $('rCap').value.trim() }) });
    const j = await r.json();
    if (!j.ok) { err(j.error); loadCaptcha(); return; }
    enter('writer', j.token, j.user);
  } catch (e) { err(e.message); loadCaptcha(); }
};
[$('lPass'), $('rPass')].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') el.blur(); }));
</script>
  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/service-worker.js").catch(function () {});
    });
  }
  </script>
</body>
</html>
