<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>派单总览 · 财务对账 · 管理后台</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#faf7f1">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="stylesheet" href="/admin/app.css">
<style>
  /* 【v20.8】本页已改为薄壳：渲染逻辑与后台「派单总览 / 财务对账」两个面板共用 /admin/mod-cards.js。
     这里只负责"独立打开时"的外层留白、面包屑与两个 tab 的切换，不再复制业务代码。
     老链接 /dispatch-overview.html?tab=recon 仍然直达财务对账。 */
  body { padding: 24px 18px 64px; }
  .page { max-width: 960px; margin: 0 auto; }
  .crumb { font-size: 12.5px; color: var(--ink2); margin-bottom: 12px; }
  .crumb a { color: var(--green2); }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tabs button { font-size: 14px; padding: 8px 18px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink2); cursor: pointer; }
  .tabs button.on { background: var(--green); color: #fff; border-color: var(--green); }
</style>
</head>
<body>
<div class="page">
  <div class="crumb"><a href="/admin.html">🏠 工作台</a> / 派单总览与财务对账</div>
  <div class="tabs">
    <button class="on" id="tabOv">派单总览</button>
    <button id="tabRecon">财务对账</button>
  </div>
  <div id="boxOv"><div id="ovRoot"><div class="skeleton"><i></i><i></i><i></i><i></i></div></div></div>
  <div id="boxRecon" style="display:none"><div id="reconRoot"><div class="skeleton"><i></i><i></i><i></i><i></i></div></div></div>
</div>
<script type="module">
  import { guardAdmin } from '/admin/app.js';
  import { mountOverview, mountRecon } from '/admin/mod-cards.js';

  const $ = id => document.getElementById(id);
  let ov = null, rec = null;

  function showTab(t) {
    $('tabOv').className = t === 'ov' ? 'on' : '';
    $('tabRecon').className = t === 'recon' ? 'on' : '';
    $('boxOv').style.display = t === 'ov' ? '' : 'none';
    $('boxRecon').style.display = t === 'recon' ? '' : 'none';
    if (t === 'ov') { if (!ov) ov = mountOverview($('ovRoot')); else ov.refresh(); }
    if (t === 'recon') { if (!rec) rec = mountRecon($('reconRoot')); else rec.refresh(); }
  }
  $('tabOv').onclick = () => showTab('ov');
  $('tabRecon').onclick = () => showTab('recon');

  if (guardAdmin()) showTab(location.search.includes('tab=recon') ? 'recon' : 'ov');
</script>
</body>
</html>
